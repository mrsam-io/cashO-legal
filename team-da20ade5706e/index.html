<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CashO Admin</title>
<style>
  :root { --bg:#fff; --fg:#111; --mut:#666; --line:#ddd; --card:#f6f6f6; --btn:#111; --btnfg:#fff; --bad:#c62828; --ok:#2e7d32; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#eee; --mut:#999; --line:#333; --card:#1c1c1c; --btn:#eee; --btnfg:#111; --bad:#ef5350; --ok:#66bb6a; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system, system-ui, sans-serif; max-width:1000px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 12px; }
  nav { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  button, select, input { font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button { cursor:pointer; } button.primary { background:var(--btn); color:var(--btnfg); border-color:var(--btn); }
  button.danger { color:var(--bad); } nav button.on { background:var(--btn); color:var(--btnfg); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin:10px 0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .mut { color:var(--mut); font-size:13px; } .bad { color:var(--bad); } .ok { color:var(--ok); }
  table { width:100%; border-collapse:collapse; font-size:14px; } td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-word; }
  #msg { min-height:20px; margin:8px 0; }
  a { color:var(--fg); text-decoration:underline; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<h1>CashO Admin</h1>
<div class="row">
  <input id="secret" type="password" placeholder="Admin secret" autocomplete="off" size="36">
  <button class="primary" id="go">Open</button>
</div>
<div id="msg" class="mut">The secret stays in this tab only. Close the tab and it is gone.</div>
<nav id="tabs" hidden></nav>
<input id="q" type="search" placeholder="Search this tab (name, username, IBAN, product, status...)" size="50" hidden>
<div class="mut" id="count"></div>
<div id="view"></div>

<script>
// Everything shown from the database is put in with textContent, never as HTML, so a hostile note or name cannot run code here.
const BASE = "https://kzamtrkxckztyxhcypqk.supabase.co/functions/v1/";
let secret = "", tab = "", isOwner = false;
const $ = (id) => document.getElementById(id);
const sar = (h) => (h / 100).toLocaleString("en", { minimumFractionDigits: 2 }) + " SAR";
const TEAM_URL = "https://mrsam-io.github.io/cashO-legal/team-da20ade5706e/";   // the link friends open (the published copy of this page)
const orderNo = (id) => "#" + String(id || "").slice(0, 8).toUpperCase();   // the same short number the buyer and the seller see on their order
const when = (t) => t ? new Date(t).toLocaleString() : "";

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) { if (k === "onclick") n.onclick = v; else if (k === "class") n.className = v; else n.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null) n.append(k);
  return n;
}
function say(text, cls = "mut") { const m = $("msg"); m.className = cls; m.textContent = text; }

async function call(fn, body) {
  const r = await fetch(BASE + fn, { method: "POST", headers: { "x-admin-secret": secret, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: "Bad reply" }));
  if (!r.ok || j.error) throw new Error(j.error || "Error " + r.status);
  return j;
}
async function act(fn, body, done) {   // run an action, show the result, reload the tab
  try { const j = await call(fn, body); say((done || "Done") + (j.emailed === true ? " · seller emailed" : j.emailed === false ? " · no email sent (seller has no email or email not set up)" : ""), "ok"); await show(tab); return j; } catch (e) { say(e.message, "bad"); }
}
async function removeProductFlow(a) {   // a = {product_id, reason, strike, report_id?}: removes a product, then handles the refunds
  try {
    const j = a.report_id
      ? await call("admin", { action: "review_report", id: a.report_id, report_action: "remove_product", reason: a.reason, strike: a.strike })
      : await call("admin", { action: "remove_product", product_id: a.product_id, reason: a.reason, strike: a.strike });
    let msg = "Product removed, seller emailed" + (j.strike ? " · strike given" : "") + (j.auction_cancelled ? " · auction cancelled" : "");
    if (j.refunds_queued) {
      if (isOwner) { try { await call("refund", { action: "run" }); msg += ` · ${j.refunds_queued} paid order(s) refunded`; } catch (e) { msg += ` · ${j.refunds_queued} refund(s) waiting: press "Process waiting refunds" in the Claims tab`; } }
      else msg += ` · ${j.refunds_queued} paid order(s) waiting for a refund: ask the owner to press "Process waiting refunds"`;
    }
    if (j.orders_in_progress) msg += ` · ${j.orders_in_progress} order(s) already shipped: handle them in Orders / Claims`;
    say(msg, "ok"); await show(tab);
  } catch (e) { say(e.message, "bad"); }
}
// CSV for Excel / Numbers / Google Sheets. The BOM makes Arabic names show correctly. A cell starting with = + - @ gets a leading ' so a hostile
// name or product title can never run as a spreadsheet formula.
function toCSV(rows) {
  const esc = (v) => { let s = String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return "﻿" + rows.map((r) => r.map(esc).join(",")).join("\r\n");
}
function download(name, rows) {
  const a = el("a", { href: URL.createObjectURL(new Blob([toCSV(rows)], { type: "text/csv;charset=utf-8" })), download: name });
  document.body.append(a); a.click(); a.remove();
}
const num = (h) => (h / 100).toFixed(2);   // halalas -> "1295.00"
const day = () => new Date().toISOString().slice(0, 10);

// the search box hides cards and table rows of the current tab that do not contain the text
function applyFilter() {
  const t = $("q").value.trim().toLowerCase();
  const items = [...$("view").querySelectorAll(".card, tr")].filter((n) => !n.querySelector("th"));
  let shown = 0;
  for (const n of items) { const hit = !t || n.textContent.toLowerCase().includes(t); n.hidden = !hit; if (hit) shown++; }
  $("count").textContent = t ? `${shown} of ${items.length} match` : "";
}

function link(url, text) { return url ? el("a", { href: url, target: "_blank", rel: "noopener" }, text) : el("span", { class: "mut" }, "no photo"); }

const TABS = {
  async Claims(v) {
    const find = el("input", { placeholder: "Find a claim by order number (#A1B2C3D4 or full ID)", size: "34", value: window.claimQuery || "" });
    const findBtn = el("button", { onclick: () => { window.claimQuery = find.value.trim(); show("Claims"); } }, "Find");
    find.addEventListener("keydown", (e) => { if (e.key === "Enter") findBtn.click(); });
    v.append(el("div", { class: "row" }, find, findBtn, window.claimQuery ? el("button", { onclick: () => { window.claimQuery = ""; show("Claims"); } }, "Show open claims") : null));
    const { claims } = await call("admin", { action: "claims", q: window.claimQuery || undefined });
    if (!claims.length) v.append(el("p", { class: "mut" }, window.claimQuery ? "No claim for this order number." : "No open claims."));
    for (const c of claims) {
      const o = c.orders || {};
      v.append(el("div", { class: "card" },
        el("b", {}, `Order ${orderNo(o.id)} · ${o.product_title || "?"} · ${sar(o.total_halalas || 0)}`),
        el("div", { class: "mut" }, `Full order ID: ${o.id || "?"}`),
        el("div", {}, `Reason: ${c.reason} · opened ${when(c.created_at)} · status: ${c.status}`),
        el("div", { class: "mut" }, `Buyer's note: ${c.note || "(none)"}`),
        (c.photo_urls || []).length
          ? el("div", { class: "row" }, el("span", { class: "mut" }, "Buyer's photos:"), ...c.photo_urls.map((u) => el("a", { href: u, target: "_blank", rel: "noopener" }, el("img", { src: u, style: "height:90px;margin-right:6px;border-radius:6px;border:1px solid #444" }))))
          : el("div", { class: "mut" }, c.reason === "not_delivered" ? "No photo (the parcel never arrived)." : "No photo."),
        el("div", { class: "mut" }, `Carrier: ${o.carrier || "?"} · tracking: ${o.tracking_number || "?"} · `, link(c.proof_url, "shipping proof photo")),
        (c.messages || []).length ? el("div", { class: "mut" }, el("b", {}, "Order messages:"), ...c.messages.map((m) => el("div", { dir: "auto" }, `${m.who}: ${m.body}`))) : el("div", { class: "mut" }, "No messages between buyer and seller."),
        c.status === "refunded" || c.status === "rejected"
          ? el("div", { class: "row" }, el("b", {}, c.status === "refunded" ? "Final: the buyer was refunded." : "Final: the claim was rejected (or the time to return the item ran out)."))
          : c.status === "approved"
          ? el("div", { class: "row" },
              c.return_tracking
                ? [el("div", {}, el("b", {}, `Return shipped ${when(c.return_at)}: ${c.return_carrier} · ${c.return_tracking}`), " (check it on the courier's tracking page first)"),
                   isOwner ? el("button", { class: "primary", onclick: () => confirm(`Fallback only: normally the SELLER presses "I received the returned item" and the refund is automatic. REFUND ${sar(o.total_halalas || 0)} to the buyer now?`) && act("refund", { action: "return_refund", claim_id: c.id }, "Refunded") }, "Refund now (fallback)") : el("span", { class: "mut" }, "The seller confirms the return; the owner can refund if the seller does not.")]
                : el("div", { class: "mut" }, `Approved ${when(c.approved_at)}. Waiting for the buyer to send the item back (7 days, then the claim closes and the seller is paid).`))
          : el("div", { class: "row" },
              el("button", { class: "primary", onclick: () => confirm("Approve this claim? The buyer must send the item back first. No money moves yet.") && act("refund", { action: "claim", claim_id: c.id, approve: true }, "Approved: waiting for the return") }, "Approve (buyer returns the item)"),
              el("button", { class: "danger", onclick: () => confirm("Reject this claim? The seller will be paid.") && act("refund", { action: "claim", claim_id: c.id, approve: false }, "Rejected") }, "Reject"))));
    }
    v.append(el("div", { class: "row" }, el("button", { onclick: () => act("refund", { action: "run" }, "Refund queue processed") }, "Process waiting refunds")));
  },

  async Reports(v) {
    const { reports } = await call("admin", { action: "reports" });
    v.append(el("p", { class: "mut" }, "Reports from users. Reply to serious ones within 24 hours (Apple expects fast action on abusive content)."));
    if (!reports.length) v.append(el("p", {}, "No open reports."));
    const label = { seller: "a seller", live: "a live", message: "a live chat message", order_message: "an order message", video: "a product video", review: "a review", comment: "a video comment", product: "a product", vehicle: "a vehicle listing", vehicle_message: "a vehicle chat message" };
    for (const r of reports) {
      const who = `${r.seller_name} (@${r.seller_username})`;
      v.append(el("div", { class: "card" },
        el("b", {}, `${r.reason} · reported ${label[r.target_type] || r.target_type}: ${who}`),
        el("div", { class: "mut" }, `"${r.snapshot}"`),
        r.target_type === "product" && r.product_photo ? el("img", { src: r.product_photo, style: "width:120px;height:120px;object-fit:cover;border-radius:8px;display:block;margin:8px 0" }) : null,
        r.target_type === "product" && r.product_removed ? el("div", { class: "bad" }, "This product is already removed or gone.") : null,
        r.target_type === "vehicle" && r.vehicle_photo ? el("img", { src: r.vehicle_photo, style: "width:120px;height:120px;object-fit:cover;border-radius:8px;display:block;margin:8px 0" }) : null,
        r.target_type === "vehicle" && !r.vehicle_live ? el("div", { class: "bad" }, `This listing is not live (${r.vehicle_status}).`) : null,
        r.target_type === "video" ? (r.video_url ? el("video", { src: r.video_url, controls: "", playsinline: "", preload: "metadata", style: "max-width:260px;max-height:360px;display:block;margin:8px 0" }) : el("div", { class: "mut" }, "The video was already removed.")) : null,
        r.note ? el("div", {}, `Reporter's note: ${r.note}`) : null,
        el("div", { class: "mut" }, `By @${r.reporter_username} · ${when(r.created_at)} · ${r.open_against_seller} open report(s) against this person`),
        el("div", {}, `The reported person is ${r.role}.` + (r.is_seller ? " They also have a seller account" + (r.seller_suspended ? " (suspended)." : ".") : " They have no seller account.")),
        el("div", { class: "row" },
          ["message", "order_message", "vehicle_message"].includes(r.target_type) ? el("button", { onclick: () => confirm("Delete this message?") && act("admin", { action: "review_report", id: r.id, report_action: "delete_message" }, "Message deleted") }, "Delete message") : null,
          r.target_type === "review" ? el("button", { class: "danger", onclick: () => confirm("Remove this review for good?") && act("admin", { action: "review_report", id: r.id, report_action: "remove_review" }, "Review removed") }, "Remove review") : null,
          r.target_type === "comment" ? el("button", { class: "danger", onclick: () => confirm("Remove this comment for good?") && act("admin", { action: "review_report", id: r.id, report_action: "remove_comment" }, "Comment removed") }, "Remove comment") : null,
          r.target_type === "video" && r.video_url ? el("button", { class: "danger", onclick: () => confirm("Remove this video for good? The seller can post a new one.") && act("admin", { action: "review_report", id: r.id, report_action: "remove_video" }, "Video removed") }, "Remove video") : null,
          ...(r.target_type === "product" && !r.product_removed ? (() => {
            const reasonsP = { prohibited_item: "Medicine or drugs", illegal: "Illegal item", weapons: "Weapons", counterfeit: "Counterfeit or fake", offensive: "Offensive content", other: "Other rule break" };
            const sel = el("select", {}, ...Object.entries(reasonsP).map(([k, t]) => el("option", { value: k }, t)));
            const strike = el("input", { type: "checkbox", checked: "" });
            return [sel, el("label", {}, strike, " strike"),
              el("button", { class: "danger", onclick: () => confirm(`Remove this product (${reasonsP[sel.value]})${strike.checked ? " and give the seller a strike" : ""}? Paid orders that are not shipped yet are refunded.`) && removeProductFlow({ report_id: r.id, reason: sel.value, strike: strike.checked }) }, "Remove product")];
          })() : []),
          r.target_type === "vehicle" && r.vehicle_live ? el("button", { class: "danger", onclick: () => { const why = prompt("Reason for the seller (they get it by email). The listing fee is kept."); if (!why || !why.trim()) return; const strike = confirm("Also give the seller a strike?"); act("admin", { action: "review_report", id: r.id, report_action: "remove_vehicle", reason: why.trim(), strike }, "Listing taken down"); } }, "Take down listing") : null,
          r.is_seller && !r.seller_suspended ? el("button", { class: "danger", onclick: () => confirm(`Suspend the SELLING of ${who}? They cannot sell or go live (their live ends now). They can still buy and chat. Undo in the Sellers tab.`) && act("admin", { action: "review_report", id: r.id, report_action: "suspend" }, "Selling suspended") }, "Suspend selling") : null,
          el("button", { class: "danger", onclick: async () => { if (!confirm(`BAN the account of ${who}? They cannot sign in at all until you unban them (below). Their orders and data stay.`)) return;
            await act("admin", { action: "ban_user", user_id: r.seller_id, banned: true }, "Account banned"); await act("admin", { action: "review_report", id: r.id, report_action: "actioned" }, "Account banned and report closed"); } }, "Ban account"),
          el("button", { onclick: () => act("admin", { action: "review_report", id: r.id, report_action: "actioned" }, "Marked as handled") }, "Mark handled"),
          el("button", { onclick: () => act("admin", { action: "review_report", id: r.id, report_action: "dismiss" }, "Dismissed") }, "Dismiss"))));
    }
  },

  async Banned(v) {
    const { banned } = await call("admin", { action: "banned_users" });
    v.append(el("h3", {}, "Banned accounts"), el("p", { class: "mut" }, "These people cannot sign in. A phone that was already signed in can keep working for up to about an hour."));
    if (!banned.length) v.append(el("p", { class: "mut" }, "Nobody is banned."));
    for (const u of banned) v.append(el("div", { class: "card" }, el("b", {}, `${u.name} (@${u.username})`), el("div", { class: "mut" }, u.email || ""),
      el("div", { class: "row" }, el("button", { onclick: () => confirm(`Unban ${u.name}?`) && act("admin", { action: "ban_user", user_id: u.user_id, banned: false }, "Account unbanned") }, "Unban"))));
  },

  async Words(v) {
    const { words } = await call("admin", { action: "words" });
    const input = el("input", { placeholder: "Word or short phrase", size: 24 });
    const mode = el("select", {}, el("option", { value: "word" }, "Whole word only"), el("option", { value: "contains" }, "Anywhere inside a word"));
    v.append(
      el("p", { class: "mut" }, "These words are blocked in chat, live titles, product titles and descriptions, names, bios and usernames. Case, Arabic letter variants, dots between letters and simple number swaps (sh1t) are ignored. Use \"Anywhere inside a word\" for Arabic words that take prefixes; it can also block innocent words, so use it sparingly."),
      el("div", { class: "card" }, el("div", { class: "row" }, input, mode,
        el("button", { class: "primary", onclick: () => input.value.trim() && act("admin", { action: "add_word", word: input.value, mode: mode.value }, "Word added") }, "Add"))),
      el("p", { class: "mut" }, `${words.length} words`));
    const t = el("table", {}, el("tr", {}, ...["Word", "Matches", ""].map((h) => el("th", {}, h))));
    for (const w of words) t.append(el("tr", {}, el("td", { dir: "auto" }, w.word), el("td", { class: "mut" }, w.mode === "contains" ? "anywhere" : "whole word"),
      el("td", {}, el("button", { class: "danger", onclick: () => act("admin", { action: "remove_word", word: w.word }, "Word removed") }, "Remove"))));
    v.append(t);
  },

  async Badges(v) {
    const { verifications } = await call("admin", { action: "verifications" });
    if (!verifications.length) v.append(el("p", { class: "mut" }, "No pending requests."));
    for (const r of verifications) {
      const company = el("input", { placeholder: "Company name (business only)", size: 30 });
      const who = r.profiles ? `@${r.profiles.username} (${r.profiles.display_name})` : "?";
      v.append(el("div", { class: "card" },
        el("b", {}, `${who} wants: ${r.kind}`), el("div", { class: "mut" }, `Note: ${r.note || "(none)"} · ${when(r.created_at)}`),
        el("div", { class: "row" }, r.kind === "business" ? company : null,
          el("button", { class: "primary", onclick: () => act("admin", { action: "review_verification", id: r.id, approve: true, company_name: company.value }, "Badge granted") }, "Approve"),
          el("button", { class: "danger", onclick: () => act("admin", { action: "review_verification", id: r.id, approve: false }, "Rejected") }, "Reject"))));
    }
  },

  async Sellers(v) {
    const { sellers } = await call("admin", { action: "sellers" });
    for (const s of sellers) {
      v.append(el("div", { class: "card" },
        el("b", {}, `${s.full_name} (@${s.username}) · ${s.kind}`),
        el("div", {}, `IBAN: ${s.iban}`), s.cr_number ? el("div", { class: "mut" }, `CR: ${s.cr_number}`) : null,
        el("div", { class: s.iban_verified ? "ok" : "bad" }, s.iban_verified ? "IBAN verified" : "IBAN NOT verified", s.suspended ? " · SUSPENDED" : ""),
        el("div", { class: "row" }, link(s.proof_url, "IBAN proof photo"),
          el("button", { class: s.suspended ? "" : "danger", onclick: () => confirm(s.suspended ? `Allow ${s.full_name} to sell again?` : `Suspend ${s.full_name}? Their live ends now and they cannot sell.`) && act("admin", { action: "set_suspended", user_id: s.user_id, suspended: !s.suspended }, s.suspended ? "Seller un-suspended" : "Seller suspended") }, s.suspended ? "Un-suspend" : "Suspend"),
          s.iban_verified
            ? el("button", { class: "danger", onclick: () => act("admin", { action: "verify_iban", user_id: s.user_id, verified: false }, "Verification removed") }, "Remove verification")
            : el("button", { class: "primary", onclick: () => confirm(`Does the proof show IBAN ${s.iban} in the name ${s.full_name}?`) && act("admin", { action: "verify_iban", user_id: s.user_id, verified: true }, "IBAN verified") }, "Verify IBAN"))));
    }
    if (!sellers.length) v.append(el("p", { class: "mut" }, "No sellers yet."));
  },

  async Money(v) {
    const m = await call("admin", { action: "money" });
    const card = (title, value, help, cls = "") => el("div", { class: "card" }, el("div", { class: "mut" }, title), el("b", { class: cls, style: "font-size:20px" }, value), el("div", { class: "mut" }, help));
    v.append(
      el("h3", {}, "Your profit"),
      card("Commission earned (completed orders)", sar(m.commission_earned), "The 15% you keep. Counted only when the claim window is over and the sale is final.", "ok"),
      card("Estimated Moyasar fees (worst case)", sar(m.est_fees), "About 2.5% + 1 SAR per payment. The real fees are in your Moyasar dashboard."),
      card("Estimated profit", sar(m.commission_earned - m.est_fees), "Commission minus the fee estimate. Before your other costs (AWS, Supabase, etc).", "ok"),
      card("Coming later (orders still in progress)", sar(m.commission_pending), "Commission on orders not final yet. Could still be refunded."),
      el("h3", {}, "Seller money"),
      card("Owed to sellers, ready to pay NOW", sar(m.owed_ready), "Transfer this from your bank. Details are in the Payouts tab.", m.owed_ready ? "bad" : ""),
      card("Owed but blocked (seller IBAN not verified)", sar(m.owed_blocked), "Verify the seller's IBAN in the Sellers tab to release it."),
      card("Already paid to sellers", sar(m.paid_out), "Orders you marked as paid."),
      el("h3", {}, "Customer money"),
      card("Collected from buyers (all time)", sar(m.collected), "Everything buyers paid through Moyasar, including refunded orders."),
      card("Refunded to buyers", sar(m.refunded), m.refund_waiting ? `Plus ${sar(m.refund_waiting)} waiting to be refunded (Claims tab, Process waiting refunds).` : "Nothing waiting."),
      card("Held for orders in progress", sar(m.held_in_progress), "Paid but not final yet: waiting to ship, in delivery, or inside the claim window. Not yours and not the seller's yet."));
  },

  async Suggestions(v) {
    const sel = el("select", {}, el("option", { value: "new" }, "New"), el("option", { value: "read" }, "Read"), el("option", { value: "done" }, "Done"), el("option", { value: "" }, "All"));
    sel.value = window.suggestionFilter ?? "new";
    sel.onchange = () => { window.suggestionFilter = sel.value; show("Suggestions"); };
    const { suggestions } = await call("admin", { action: "suggestions", status: sel.value || undefined });
    v.append(el("div", { class: "row" }, sel, el("span", { class: "mut" }, `${suggestions.length} shown (latest 200)`)));
    if (!suggestions.length) v.append(el("p", { class: "mut" }, "Nothing here."));
    const kinds = { idea: "Idea", problem: "Problem", other: "Other" };
    for (const s of suggestions) {
      v.append(el("div", { class: "card" },

  async Products(v) {

      const state = p.removed_by_admin ? "REMOVED by admin: " + (reasons[p.removal_reason] || p.removal_reason) : (p.active ? (p.in_shop ? "Live in the Shop" : "Active") : "Hidden by the seller");
      const card = el("div", { class: "card" },

          el("div", {}, el("b", {}, p.title), el("div", { class: "mut" }, `#${p.id.slice(0, 8).toUpperCase()} · ${p.seller || "?"} (@${p.username || "?"}) · ${sar(p.price_halalas)} · qty ${p.quantity}`), el("div", { class: p.removed_by_admin ? "bad" : "mut" }, state))),
        p.description ? el("div", { dir: "auto", style: "white-space:pre-wrap;margin:6px 0" }, p.description) : null);
      if (p.removed_by_admin) {

      } else {

  async Vehicles(v) {

        el("div", { class: "row" }, el("button", { class: "primary", onclick: () => confirm(`Have you transferred ${sar(o.payout_halalas)} to ${o.full_name}?`) && act("admin", { action: "vehicle_paid", id: o.id }, "Marked as paid") }, "Mark paid"))));

      v.append(el("div", { class: "card" },

        el("div", {}, x.description || ""), imgs, x.video_url ? el("a", { href: x.video_url, target: "_blank" }, "Watch the video") : null,
        el("div", { class: "mut" }, "Check: real vehicle photos, a sensible title and price, no banned items, nothing that looks stolen or fake. Approve only if it is OK."),
        el("div", { class: "row" },
          el("button", { class: "primary", onclick: () => confirm(`Approve "${x.title}"? It goes live now.`) && act("admin", { action: "review_vehicle", id: x.id, approve: true }, "Approved") }, "Approve"),
          el("button", { class: "danger", onclick: () => { const why = prompt("Reason for the seller (they get it by email). The fee is refunded."); if (why && why.trim()) act("admin", { action: "review_vehicle", id: x.id, approve: false, reason: why.trim() }, "Rejected and fee refunded"); } }, "Reject + refund fee"))));

        el("button", { class: "danger", onclick: () => { const why = prompt("Reason for the seller (they get it by email). The fee is kept."); if (why && why.trim()) act("admin", { action: "vehicle_takedown", id: x.id, reason: why.trim() }, "Listing taken down"); } }, "Take down")) : null));

  async Team(v) {

        el("div", { class: "row" },
          el("button", { onclick: async () => { if (!confirm(`Make a new password for ${h.name}? The old one stops working.`)) return; try { window.invite = await call("admin", { action: "reset_helper", name: h.name }); show("Team"); } catch (e) { say(e.message, "bad"); } } }, "New password"),
          el("button", { class: "danger", onclick: () => confirm(`Remove ${h.name}? Their password stops working at once.`) && act("admin", { action: "remove_helper", name: h.name }, `${h.name} removed`) }, "Remove"))));

    if (!log.length) v.append(el("p", { class: "mut" }, "Nothing yet."));
    else {
      const t = el("table", {}, el("tr", {}, ...["When", "Who", "What", "Order or item"].map((h) => el("th", {}, h))));
      for (const r of log) t.append(el("tr", {}, el("td", { class: "mut" }, when(r.at)), el("td", {}, r.who), el("td", {}, r.action), el("td", { class: "mut" }, r.target || "")));

  async Orders(v) {
    const sel = el("select", {}, el("option", { value: "" }, "All statuses"),
      ...["pending_payment","paid","shipped","received","completed","cancelled","expired","refund_pending","refunded","disputed"].map((s) => el("option", { value: s }, s)));
    sel.value = window.orderFilter || "";
    sel.onchange = () => { window.orderFilter = sel.value; show("Orders"); };
    const find = el("input", { placeholder: "Find by order number (#A1B2C3D4 or full ID)", size: "32", value: window.orderQuery || "" });
    const findBtn = el("button", { onclick: () => { window.orderQuery = find.value.trim(); show("Orders"); } }, "Find order");
    find.addEventListener("keydown", (e) => { if (e.key === "Enter") findBtn.click(); });
    const { orders } = await call("admin", { action: "orders", status: sel.value || undefined, q: window.orderQuery || undefined });
    const exportBtn = el("button", { class: "primary", onclick: async () => {   // accountant file: all orders, not only the ones on screen
      try {
        say("Preparing file...");
        const all = (await call("admin", { action: "orders", export: true, status: sel.value || undefined })).orders;
        const head = ["Order ID", "Created", "Paid at", "Completed at", "Status", "Product", "Buyer username", "Buyer name", "Seller username", "Seller name", "Seller IBAN", "IBAN verified",
                      "Total SAR (buyer paid)", "Item SAR", "Shipping SAR", "Commission SAR (our revenue)", "Seller amount SAR", "Moyasar payment ID", "Paid out to seller at", "Refund reason"];
        download(`cashO-orders-${day()}.csv`, [head, ...all.map((o) => [o.id, o.created_at, o.paid_at, o.completed_at, o.status, o.product_title, o.buyer_username, o.buyer_name,
          o.seller_username, o.seller_name, o.seller_iban, o.seller_iban_verified ? "yes" : "no", num(o.total_halalas), num(o.item_halalas), num(o.shipping_halalas),
          num(o.commission_halalas), num(o.seller_halalas), o.payment_id, o.paid_out_at, o.refund_reason])]);
        say(`Downloaded ${all.length} orders.`, "ok");
      } catch (e) { say(e.message, "bad"); }

    v.append(el("div", { class: "row" }, find, findBtn, window.orderQuery ? el("button", { onclick: () => { window.orderQuery = ""; show("Orders"); } }, "Show all") : null));

    const t = el("table", {}, el("tr", {}, ...["Order", "Product", "Status", "Buyer", "Seller", "Total", "Commission", "Note", "Created"].map((h) => el("th", {}, h))));
    for (const o of orders) t.append(el("tr", {}, el("td", { title: o.id }, orderNo(o.id), el("span", { hidden: "" }, " " + o.id)), el("td", {}, o.product_title), el("td", {}, o.status), el("td", {}, "@" + o.buyer_username), el("td", {}, `${o.seller_name} (@${o.seller_username})`),
      el("td", {}, sar(o.total_halalas)), el("td", {}, sar(o.commission_halalas)),
      el("td", { class: "mut" }, [o.refund_reason, o.paid_out_at ? "paid out" : ""].filter(Boolean).join(", ")), el("td", { class: "mut" }, when(o.created_at))));

  async Payouts(v) {
    const { payouts } = await call("refund", { action: "payouts" });
    v.append(el("p", { class: "mut" }, "Owed = item price - commission + shipping fee, completed orders only, IBAN-verified sellers only. Transfer the money from your bank first, then press Mark paid."));

    else v.append(el("button", { onclick: () => download(`cashO-payouts-${day()}.csv`, [["Seller name", "IBAN", "Orders", "Amount to transfer SAR", "List date"],

      v.append(el("div", { class: "card" },
        el("b", {}, `${p.full_name} · ${sar(p.owed_halalas)}`), el("div", {}, `IBAN: ${p.iban}`), el("div", { class: "mut" }, `${p.orders} order(s)`),
        el("div", { class: "row" }, el("button", { class: "primary", onclick: () => confirm(`Have you transferred ${sar(p.owed_halalas)} to ${p.full_name}?`) && act("refund", { action: "paid", seller_id: p.seller_id, as_of: p.as_of }, "Marked as paid") }, "Mark paid"))));
    }

};

let showSeq = 0;
async function show(name) {
  tab = name; const mine = ++showSeq;
  for (const b of $("tabs").children) b.classList.toggle("on", b.textContent === name);
  // Every load gets its OWN container. Before, all tabs wrote into the same box, so a slow tab that finished after you had moved on
  // added its content to the newer tab (everything showed together). Now an old tab can only write into a box nobody sees any more.
  const v = el("div"); $("view").replaceChildren(v);
  const loading = el("p", { class: "mut" }, "Loading…"); v.append(loading);
  try { await TABS[name](v); } catch (e) { if (mine === showSeq) say(e.message, "bad"); }
  loading.remove();
  if (mine === showSeq) applyFilter();   // keep the search text when a tab reloads after an action
}
$("q").addEventListener("input", applyFilter);

$("go").onclick = async () => {
  secret = $("secret").value.trim(); $("secret").value = "";
  if (!secret) return;
  let me;
  try { me = await call("admin", { action: "whoami" }); } catch (e) { secret = ""; return say(e.message, "bad"); }
  // a helper (a friend) only gets the tabs they are allowed to use; the server checks it again on every call
  isOwner = !!me.owner;
  const names = Object.keys(TABS).filter((n) => me.owner || !["Money", "Team", "Payouts"].includes(n));
  say(me.owner ? "Signed in as the owner." : `Signed in as ${me.name} (helper: everything except money, payouts and team).`, "ok");
  $("q").hidden = false;
  const nav = $("tabs"); nav.hidden = false; nav.replaceChildren(...names.map((n) => el("button", { onclick: () => show(n) }, n)));
  show("Claims");
};
$("secret").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
