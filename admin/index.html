<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casho Admin</title>
<link rel="icon" href="https://appcasho.com/assets/icon.png"><meta name="theme-color" content="#122D24">
<style>
  @font-face { font-family:"Manrope"; src:url(https://appcasho.com/assets/fonts/Manrope-Variable.ttf) format("truetype"); font-weight:200 800; font-display:swap; }
  @font-face { font-family:"Tajawal"; src:url(https://appcasho.com/assets/fonts/Tajawal-Regular.ttf) format("truetype"); font-weight:400; font-display:swap; }
  /* Casho brand kit */
  :root { --emerald:#188B67; --deep:#126C50; --forest:#122D24; --gold:#BFA060; --bg:#F1E8D6; --fg:#122D24; --mut:#5f6f66; --line:#e3d8c0; --card:#FFFDF8; --btn:#188B67; --btnfg:#fff; --bad:#c62828; --ok:#126C50; --head:#126C50; --bar:#188B67; }
  @media (prefers-color-scheme: dark) { :root { --bg:#122D24; --fg:#F5EEDD; --mut:#a9bdb3; --line:#27493c; --card:#183A2F; --btn:#188B67; --btnfg:#fff; --bad:#ef7b76; --ok:#48C5A2; --head:#FFEBC6; --bar:#48C5A2; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.45 "Manrope","Tajawal",-apple-system,system-ui,sans-serif; max-width:1240px; margin-inline:auto; }
  header.brand { display:flex; align-items:center; gap:12px; padding:6px 0 14px; border-bottom:2px solid var(--gold); margin-bottom:12px; }
  header.brand img { height:36px; width:auto; display:block; } header.brand .logo-dark { display:none; }
  @media (prefers-color-scheme: dark) { header.brand .logo-light { display:none; } header.brand .logo-dark { display:block; } }
  header.brand span { font-weight:800; font-size:18px; color:var(--head); }
  .sec { border-top:1px solid var(--gold,#c9a45c); margin:28px 0 8px; padding-top:16px; } .sec h3 { margin:0 0 6px; }
  h1 { font-size:20px; margin:0 0 12px; color:var(--head); } h2, h3 { color:var(--head); }
  #shell { display:grid; grid-template-columns:230px minmax(0,1fr); gap:22px; align-items:start; margin-top:8px; }
  #tabs { position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:8px; }
  #tabs .grp { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); font-weight:800; margin:14px 10px 4px; }
  #tabs button { display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; text-align:left; border:0; background:transparent; padding:8px 10px; border-radius:10px; font-weight:600; }
  #tabs button:hover { background:rgba(24,139,103,.12); } #tabs button.on { background:var(--deep); color:#fff; }
  .pill { background:var(--bad); color:#fff; border-radius:999px; font-size:12px; line-height:20px; min-width:20px; padding:0 6px; text-align:center; font-weight:800; }
  #tabs button.on .pill { background:#fff; color:var(--deep); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr)); gap:12px; margin:10px 0; }
  .tile { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:0 4px 14px rgba(18,45,36,.07); }
  .tile:hover { border-color:var(--emerald); } .tile b { display:block; font-size:30px; color:var(--bad); line-height:1.1; } .tile span { color:var(--mut); font-size:13px; font-weight:600; }
  #menuBtn { display:none; }
  @media (max-width:820px) { #shell { grid-template-columns:1fr; } #menuBtn { display:flex; justify-content:space-between; width:100%; } #tabs { position:static; max-height:none; display:none; gap:4px; flex-wrap:wrap; } #tabs.open { display:flex; } #tabs .grp { width:100%; margin:8px 6px 0; } #tabs button { width:auto; } }
  button, select, input, textarea { font:inherit; padding:8px 13px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button { cursor:pointer; font-weight:600; } button.primary { background:var(--btn); color:var(--btnfg); border-color:var(--btn); }
  button.danger { color:var(--bad); } nav button.on { background:var(--deep); color:#fff; border-color:var(--deep); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin:10px 0; box-shadow:0 4px 14px rgba(18,45,36,.07); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .mut { color:var(--mut); font-size:13px; } .bad { color:var(--bad); } .ok { color:var(--ok); }
  table { width:100%; border-collapse:collapse; font-size:14px; } td, th { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-word; } th { color:var(--head); }
  #msg { min-height:20px; margin:8px 0; }
  a { color:var(--deep); } @media (prefers-color-scheme: dark) { a { color:var(--mint,#48C5A2); } }
  [hidden] { display:none !important; }
  /* a cleaner look: visible focus, soft hover, striped tables, calmer headings */
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline:2px solid var(--emerald); outline-offset:2px; }
  button { transition:background .15s, border-color .15s, transform .05s; } button:active { transform:scale(.98); }
  button:not(.primary):not(.on):hover { border-color:var(--emerald); } button.primary:hover { background:var(--deep); }
  tr:nth-child(even) td { background:rgba(18,45,36,.035); } @media (prefers-color-scheme: dark) { tr:nth-child(even) td { background:rgba(255,255,255,.04); } }
  h3 { font-size:16px; margin:24px 0 6px; letter-spacing:.01em; } h3:first-child { margin-top:4px; }
  .card { transition:box-shadow .15s; } .card:hover { box-shadow:0 6px 20px rgba(18,45,36,.12); }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:12px; }
  .chart svg { display:block; margin-top:6px; } .chart b { font-size:22px; }
  input[type=search], input#secret { min-width:0; max-width:100%; }
  #bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  #findWrap { position:relative; flex:1 1 260px; min-width:200px; } #findWrap input { width:100%; box-sizing:border-box; }
  #findRes { position:absolute; z-index:30; left:0; right:0; top:calc(100% + 4px); background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.25); overflow:hidden; }
  #findRes button { display:block; width:100%; text-align:left; border:0; border-radius:0; background:transparent; padding:9px 12px; } #findRes button b { display:block; } #findRes button.sel, #findRes button:hover { background:rgba(24,139,103,.14); }
  #refresh.spin { opacity:.6; }
  /* picture viewer: click a photo to zoom (wheel, +/-, drag, double-click, arrow keys) */
  .lb { position:fixed; inset:0; background:rgba(0,0,0,.93); z-index:100; display:flex; flex-direction:column; }
  .lbstage { flex:1; overflow:hidden; display:flex; align-items:center; justify-content:center; cursor:grab; touch-action:none; }
  .lbimg { max-width:96vw; max-height:82vh; user-select:none; -webkit-user-drag:none; transition:transform .06s; }
  .lbbar { display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; padding:10px 12px; color:#fff; } .lbbar button { min-width:42px; }
  .thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; } .thumbs img { height:116px; width:auto; max-width:100%; border-radius:10px; border:1px solid var(--line); cursor:zoom-in; display:block; transition:transform .12s, box-shadow .12s; } .thumbs img:hover { transform:scale(1.03); box-shadow:0 6px 18px rgba(0,0,0,.3); }
  .claim { padding:16px; } .claim .head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; } .claim .amt { font-weight:800; font-size:18px; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:800; letter-spacing:.02em; background:rgba(24,139,103,.16); color:var(--deep); } .badge.warn { background:rgba(214,140,0,.18); color:#a86400; } .badge.bad { background:rgba(198,40,40,.15); color:var(--bad); }
  @media (prefers-color-scheme: dark) { .badge { color:var(--ok); } .badge.warn { color:#f0b44c; } }
  .claim .box { border:1px solid var(--line); border-radius:12px; padding:10px 12px; } .claim .box h4 { margin:0 0 4px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); }
  .claim details { margin-top:10px; } .claim summary { cursor:pointer; font-weight:700; }
  .claim .actions { margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
</style>
</head>
<body>
<header class="brand"><img class="logo-light" src="https://appcasho.com/assets/logo-light.png" alt="Casho"><img class="logo-dark" src="https://appcasho.com/assets/logo-dark.png" alt="Casho"><span>Admin</span><button id="guideBtn" class="primary" style="margin-inline-start:auto" hidden>Guide</button></header>
<div class="row">
  <input id="secret" type="password" placeholder="Admin secret" autocomplete="off" size="36">
  <button class="primary" id="go">Open</button>
</div>
<div id="msg" class="mut">The secret stays in this tab only. Close the tab and it is gone.</div>
<div id="shell" hidden>
  <button id="menuBtn" type="button"><span id="menuName">Home</span><span>Menu ▾</span></button>
  <aside id="tabs"></aside>
  <main>
    <div id="bar">
      <div id="findWrap"><input id="find" type="search" placeholder="Go to a page… (try: strikes, IBAN, refund, invoice)  ·  press / to type here" autocomplete="off"><div id="findRes" hidden></div></div>
      <button id="refresh" type="button" title="Reloads the data on this page. You stay signed in.">↻ Refresh</button><span class="mut" id="stamp"></span>
    </div>
    <input id="q" type="search" placeholder="Search this tab (name, username, IBAN, product, status...)" size="50" hidden>
    <div class="mut" id="count"></div>
    <div id="view"></div>
  </main>
</div>

<script>
// Everything shown from the database is put in with textContent, never as HTML, so a hostile note or name cannot run code here.
const BASE = "https://api.appcasho.com/functions/v1/";
let secret = "", tab = "", isOwner = false;
const $ = (id) => document.getElementById(id);
const sar = (h) => (h / 100).toLocaleString("en", { minimumFractionDigits: 2 }) + " SAR";
const TEAM_URL = "https://appcasho.com/admin/";   // the link friends open (the published copy of this page)
const orderNo = (id) => "#" + String(id || "").slice(0, 8).toUpperCase();   // the same short number the buyer and the seller see on their order
const when = (t) => t ? new Date(t).toLocaleString() : "";

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) { if (k === "onclick") n.onclick = v; else if (k === "class") n.className = v; else n.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null) n.append(k);
  return n;
}
function say(text, cls = "mut") { const m = $("msg"); m.className = cls; m.textContent = text; }

async function call(fn, body) {
  const r = await fetch(BASE + fn, { method: "POST", headers: { "x-admin-secret": secret, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: "Bad reply" }));
  if (!r.ok || j.error) throw new Error(j.error || "Error " + r.status);
  return j;
}
async function act(fn, body, done) {   // run an action, show the result, reload the tab
  try { const j = await call(fn, body); say((done || "Done") + (j.emailed === true ? " · seller emailed" : j.emailed === false ? " · no email sent (seller has no email or email not set up)" : ""), "ok"); await show(tab); return j; } catch (e) { say(e.message, "bad"); }
}
async function removeProductFlow(a) {   // a = {product_id, reason, strike, report_id?}: removes a product, then handles the refunds
  try {
    const j = a.report_id
      ? await call("admin", { action: "review_report", id: a.report_id, report_action: "remove_product", reason: a.reason, strike: a.strike })
      : await call("admin", { action: "remove_product", product_id: a.product_id, reason: a.reason, strike: a.strike });
    let msg = "Product removed, seller emailed" + (j.strike ? " · strike given" : "") + (j.auction_cancelled ? " · auction cancelled" : "");
    if (j.refunds_queued) {
      if (isOwner) { try { await call("refund", { action: "run" }); msg += ` · ${j.refunds_queued} paid order(s) refunded`; } catch (e) { msg += ` · ${j.refunds_queued} refund(s) waiting: press "Refund all waiting" in the Refunds tab`; } }
      else msg += ` · ${j.refunds_queued} paid order(s) waiting for a refund: ask the owner to open the Refunds tab`;
    }
    if (j.orders_in_progress) msg += ` · ${j.orders_in_progress} order(s) already shipped: handle them in Orders / Claims`;
    say(msg, "ok"); await show(tab); return true;
  } catch (e) { say(e.message, "bad"); return false; }
}
// CSV for Excel / Numbers / Google Sheets. The BOM makes Arabic names show correctly. A cell starting with = + - @ gets a leading ' so a hostile
// name or product title can never run as a spreadsheet formula.
function toCSV(rows) {
  const esc = (v) => { let s = String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return "﻿" + rows.map((r) => r.map(esc).join(",")).join("\r\n");
}
function download(name, rows) {
  const a = el("a", { href: URL.createObjectURL(new Blob([toCSV(rows)], { type: "text/csv;charset=utf-8" })), download: name });
  document.body.append(a); a.click(); a.remove();
}
const num = (h) => (h / 100).toFixed(2);   // halalas -> "1295.00"
const day = () => new Date().toISOString().slice(0, 10);

// the search box hides cards and table rows of the current tab that do not contain the text
function applyFilter() {
  const t = $("q").value.trim().toLowerCase();
  const items = [...$("view").querySelectorAll(".card, tr")].filter((n) => !n.querySelector("th"));
  let shown = 0;
  for (const n of items) { const hit = !t || n.textContent.toLowerCase().includes(t); n.hidden = !hit; if (hit) shown++; }
  $("count").textContent = t ? `${shown} of ${items.length} match` : "";
}

function link(url, text) { return url ? el("a", { href: url, target: "_blank", rel: "noopener" }, text) : el("span", { class: "mut" }, "no photo"); }

// ---- Dashboard > Accounting: the CSV for the accountant + costs and income typed in by hand (owner only) ----
async function accountingBlock() {
  const sar = (h) => (h / 100).toLocaleString("en", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const today = new Date(), first = new Date(today.getFullYear(), today.getMonth(), 1);
  const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const from = el("input", { type: "date", value: iso(first) }), to = el("input", { type: "date", value: iso(today) });
  const out = el("div", { class: "mut" });
  const run = async (download) => {
    try {
      const j = await call("admin", { action: "accounting_export", from: from.value, to: to.value });
      out.replaceChildren(el("div", {}, `${j.rows} lines. Revenue ${sar(j.totals.revenue)} SAR · Costs ${sar(j.totals.cost)} SAR · Profit ${sar(j.profit)} SAR · Cash in ${sar(j.totals.cash_in)} · Cash out ${sar(j.totals.cash_out)} · Owed to sellers ${sar(j.totals.liability)} (in SAR)`));
      if (download) {
        const a = el("a", { href: URL.createObjectURL(new Blob([j.csv], { type: "text/csv;charset=utf-8" })), download: `casho-accounting-${from.value}_to_${to.value}.csv` });
        document.body.append(a); a.click(); a.remove();
      }
    } catch (e) { say(String(e.message || e), "bad"); }
  };
  const range = (label, f, t) => el("button", { onclick: () => { from.value = iso(f); to.value = iso(t); } }, label);
  const y = today.getFullYear(), m = today.getMonth();
  const exportCard = el("div", { class: "card" },
    el("div", { class: "mut" }, "One CSV with every money event from every source: orders, commission, refunds, seller payouts, card fees (estimate), discounts, influencers, listing fees, promotions, gifts, car deposits, withdrawal fees, and the costs you type in below. Opens in Excel."),
    el("div", { class: "row" }, "From ", from, " To ", to),
    el("div", { class: "row" }, range("This month", first, today), range("Last month", new Date(y, m - 1, 1), new Date(y, m, 0)), range("This year", new Date(y, 0, 1), today), range("All time", new Date(2026, 0, 1), today)),
    el("div", { class: "row" }, el("button", { class: "primary", onclick: () => run(true) }, "Download CSV"), el("button", { onclick: () => run(false) }, "Show totals only")),
    out);

  // costs and other income the app cannot know
  const cats = ["Software and hosting", "Payment provider", "Apple and Google fees", "Marketing and ads", "Influencers (other)", "Legal and professional", "Salaries and contractors", "Government and licences", "Shipping and packaging", "Bank fees", "Other"];
  const f = { date: el("input", { type: "date", value: iso(today) }), kind: el("select", {}, el("option", { value: "cost" }, "Cost"), el("option", { value: "revenue" }, "Other income")),
    category: el("select", {}, ...cats.map((c) => el("option", { value: c }, c))), vendor: el("input", { placeholder: "Vendor, e.g. Supabase, AWS, Cloudflare, Resend, Anthropic" }),
    description: el("input", { placeholder: "What for, e.g. Pro plan November" }), amount: el("input", { type: "number", step: "0.01", min: "0", placeholder: "Amount in SAR" }), note: el("input", { placeholder: "Note (optional), e.g. invoice number" }) };
  const list = el("div", {});
  const load = async () => {
    const { entries } = await call("admin", { action: "entry_list" });
    list.replaceChildren(...(entries.length ? entries.map((e) => el("div", { class: "row" },
      el("span", { class: "mut" }, `${e.entry_date} · ${e.kind === "cost" ? "Cost" : "Income"} · ${e.category}${e.vendor ? " · " + e.vendor : ""}${e.description ? " · " + e.description : ""}`),
      el("b", {}, sar(e.amount_halalas) + " SAR"),
      el("button", { onclick: async () => { if (confirm("Delete this line?")) { try { await call("admin", { action: "entry_delete", id: e.id }); say("Deleted", "ok"); load(); } catch (x) { say(String(x.message || x), "bad"); } } } }, "Delete"))) : [el("p", { class: "mut" }, "Nothing typed in yet.")]));
  };
  const add = async () => {
    try {
      await call("admin", { action: "entry_add", date: f.date.value, kind: f.kind.value, category: f.category.value, vendor: f.vendor.value, description: f.description.value, amount_sar: f.amount.value, note: f.note.value });
      say("Added", "ok"); f.vendor.value = f.description.value = f.amount.value = f.note.value = ""; load();
    } catch (e) { say(String(e.message || e), "bad"); }
  };
  await load().catch((e) => list.replaceChildren(el("p", { class: "mut" }, String(e.message || e))));
  const entryCard = el("div", { class: "card" },
    el("div", { class: "mut" }, "Type in what the app cannot know: provider invoices and other costs or income. They go into the CSV. Costs from Supabase, AWS, Cloudflare, Resend, Anthropic, Apple, your domain, the lawyer, salaries ..."),
    el("div", { class: "row" }, f.date, f.kind, f.category), el("div", { class: "row" }, f.vendor, f.description), el("div", { class: "row" }, f.amount, f.note),
    el("div", { class: "row" }, el("button", { class: "primary", onclick: add }, "Add line")), list);
  return [el("h3", {}, "Accounting (for the accountant)"), exportCard, el("h3", {}, "Costs and income typed in"), entryCard];
}

const GUIDES = {"owner": {"en": "<h1>Casho admin guide</h1>\n<p class=\"mut\">For the owner and the team. Keep the admin address and password private.</p>\n\n<h2>1. Sign in and who sees what</h2>\n<ul>\n<li>Open the admin page and type your password. The <b>owner</b> sees every tab. A <b>helper</b> (a friend you added in <b>Team</b>) sees everything <b>except</b>: Dashboard, Money, Refunds, Payouts, Referrals and Team, plus the on/off switches and the money decisions inside Auctions, Vehicles, Properties and Sellers. Those are marked <b>Owner</b> below. (Helpers do get Promotions, Email users and Ads.)</li>\n<li>The server checks it again on every click, so a helper cannot reach owner tabs even by trying.</li>\n<li>Everything a helper does is written to a log. The owner reads it in <b>Team, What your friends did</b>.</li>\n<li>Never share your password, and never send it in a chat. To give a friend access, use <b>Team, Add a friend</b> (it makes their own password).</li>\n<li><b>How the page is organised.</b> The <b>menu</b> on the left (on a phone: the <b>Menu</b> button at the top) groups the tabs by job: <b>Money</b>, <b>Orders</b>, <b>Listings</b>, <b>People</b> and <b>Safety and support</b>. The first page is <b>Home</b>. A <b>red number</b> next to a tab means that many things are waiting there; the numbers refresh every minute.</li>\n</ul>\n\n<h2>2. Every day, in this order</h2>\n<ol>\n<li><b>Home</b>: read the red <b>Something is wrong</b> box if there is one, then <b>Needs you now</b>. Each tile opens the tab where the work is.</li>\n<li><b>Reports</b>: handle new reports first. Offensive or illegal content should not stay up.</li>\n<li><b>Claims</b>: buyers who say there is a problem with an order.</li>\n<li><b>Tickets</b>: answer support messages.</li>\n<li><b>Vehicles</b> and <b>Properties</b> (if switched on): approve or reject new listings.</li>\n<li><b>Sellers</b> and <b>Badges</b>: approve new seller IBANs and badge requests.</li>\n<li><b>Refunds</b> (owner): if the red number is not 0, open it and press <b>Refund now</b> (or <b>Refund all waiting</b>), then read the result.</li>\n<li><b>Payouts</b> (owner): pay sellers whose orders are complete, then mark them paid.</li>\n</ol>\n\n<h2>3. What each tab does</h2>\n\n<h3>Home</h3>\n<p>The first page. If payments are failing, a red <b>Something is wrong</b> box shows at the top (a card or Tamara payment that could not be completed, a Tamara capture that keeps failing, a refund that will not go through, or the payment function crashing). You also get an email the first time. Fix it or ask your developer, then press <b>Resolved</b>. The same problem counts as one alert for 6 hours. Under it, <b>Needs you now</b> shows tiles with numbers (refunds, claims, reports, tickets, badge requests, flagged photos, sellers to pay, new suggestions): tap one to open its tab. At the bottom, the owner sees <b>charts of the last 30 days</b>: revenue and paid orders.</p>\n\n<h3>Dashboard <span class=\"mut\">(Owner)</span></h3>\n<p>The big picture: users, products, orders, revenue, Moyasar and Tamara fees, referral discounts, influencer share and your <b>profit</b>. At the top, <b>charts of the last 30 days</b> show revenue, paid orders and new users per day (tap a bar for its number, or press <b>Table</b> for every day). At the bottom is the <b>accountant file</b>: pick a date range and press <b>Download CSV</b> (or <b>Show totals only</b>). You can also type your own <b>costs and income</b> (for example the AWS bill) so the accountant file is complete.</p>\n\n<h3>Tickets</h3>\n<p>Messages users send from <b>Profile, Contact support</b>. Press <b>Send reply</b> to answer (the user sees it as \"Casho support\") and <b>Close ticket</b> when finished. Replying does <b>not</b> close the ticket, so you can reply many times; the history is kept. <b>Reopen</b> brings it back.</p>\n\n<h3>Claims</h3>\n<p>A buyer says there is a problem after delivery (or the parcel did not arrive). Open the claim, read the buyer's <b>photos and messages</b> and the seller's tracking photo, then:</p>\n<ul>\n<li><b>Approve (buyer returns the item)</b>: the buyer sends it back, and the money is refunded when the seller confirms it arrived.</li>\n<li><b>Reject</b>: the claim is closed and the seller is paid as normal.</li>\n<li><b>Refund now (fallback)</b> and the <b>Refunds</b> tab (owner only): shows what waits for a refund and what was refunded; use it if a refund seems stuck.</li>\n</ul>\n<p>Use <b>Find</b> to look up an order by its number. Be fair and write short notes: money is involved.</p>\n\n<h3>Photos</h3>\n<p>Every listing photo is checked automatically. Photos that looked unsafe wait here (some are fine, like swimwear). <b>Looks fine</b> clears it. <b>Remove this photo</b> takes only that photo off and emails the seller to add another. <b>Remove listing</b> takes the whole listing down. Nothing is hidden until a person decides.</p>\n\n<h3>Reports</h3>\n<p>Users report lives, videos, comments, messages, reviews, profiles and listings. For each report you can <b>Dismiss</b> (nothing wrong), take the content down (<b>Remove video / comment / message / listing</b>), <b>Ban account</b>, or <b>Mark handled</b>. When unsure, take the content down first and decide about the account after.</p>\n\n<h3>Banned</h3>\n<p>The list of banned accounts, with <b>Unban</b>. A banned person cannot use the app.</p>\n\n<h3>Words</h3>\n<p>The blocked-words list for chats and comments. <b>Add</b> a word and choose <b>Whole word only</b> (safer) or <b>Anywhere inside a word</b> (stronger, but may block innocent words). <b>Remove</b> deletes it.</p>\n\n<h3>Badges</h3>\n<p>Requests for the blue verified badge. Check the proof, then <b>Approve</b> or <b>Reject</b>.</p>\n\n<h3>Sellers</h3>\n<p>All sellers. Use <b>Verify IBAN</b> after checking that the IBAN is in the seller's own name (the proof photo is there). <b>Remove verification</b> undoes it. You can also <b>suspend</b> a seller (their live and sales stop) and change a seller's settings. A seller cannot be paid before the IBAN is verified. At the top you see <b>Sellers with strikes</b> (from cancelling paid orders, cancelling auctions after a bid, or removed products): <b>Clear strikes</b> resets a seller after you have talked to them.</p>\n\n<h3>Money <span class=\"mut\">(Owner)</span></h3>\n<p>Customer money held by Casho, money owed to sellers, the estimated <b>Moyasar and Tamara fees</b>, <b>your profit</b>, and the switch for the <b>Support Casho</b> button (keep it OFF at launch).</p>\n\n<h3>Suggestions</h3>\n<p>The suggestion box from users. Mark each one <b>Read</b>, <b>Done</b> or <b>Delete</b>. Good ideas here are free product advice.</p>\n\n<h3>Products</h3>\n<p>Find any product by its number (the user sees it as <b>Product #12345678</b> and can copy it) or by name. <b>Remove product</b> takes it down (use for banned items: weapons, alcohol, medicine, fakes). <b>Restore</b> puts it back. Removing a product with a running auction cancels it and gives the seller a strike, so be sure.</p>\n\n<h3>Auctions</h3>\n<p>Running item auctions. The owner has the on/off switch for item auctions.</p>\n\n<h3>Vehicles</h3>\n<p>New car listings wait here for <b>approval</b> (the seller already paid the listing fee). <b>Approve</b>, or <b>Reject</b> (the seller can fix it and send it again for free; the fee is never refunded). Also here: <b>Vehicle deals in progress</b> (deposit auctions): when a deal fails, choose who is at fault (<b>Buyer at fault</b> or <b>No fault: refund buyer</b>) and the result is applied (refund, strike, deposit owed). <b>Deposits owed to sellers</b>: pay them, then press <b>Mark paid</b>. The owner has the on/off switches. Keep vehicle auctions OFF at launch.</p>\n\n<h3>Properties</h3>\n<p>Same idea for properties: <b>Approve</b> or <b>Reject + refund fee</b> (check the photos, the licence number and the map pin), <b>Take down</b> later if needed. <b>How properties work</b> and <b>Watch the video</b> are short helpers. Casho only introduces buyer and seller; the deal happens outside the app.</p>\n\n<h3>Orders</h3>\n<p>Every order with its status. <b>Find order</b> by number, filter by status, and <b>Download CSV</b> for the accountant.</p>\n\n<h3>Refunds <span class=\"mut\">(Owner)</span></h3>\n<p>Orders waiting to be refunded to the buyer (card, Apple Pay or Tamara), each with <b>Refund now</b>, and <b>Refund all waiting</b>. After you press, a box shows for each order <b>Refunded</b> or <b>Not refunded</b> with the reason. <b>Refunded lately</b> lists the latest ones. Refunds also retry by themselves every minute.</p>\n\n<h3>Payouts <span class=\"mut\">(Owner)</span></h3>\n<p>What Casho owes sellers for completed orders. Transfer the money from the bank to the seller's IBAN, then press <b>Mark paid</b>. <b>Download this list (CSV)</b> gives you the list for the bank. Only pay verified IBANs. When Moyasar Payouts is switched on, each seller also has <b>Pay with Moyasar</b>: it sends the money from your bank account by itself, then the seller is emailed. The status (paid, on its way, failed) shows under <b>Paid through Moyasar</b> and updates by itself; a failed payout puts the orders back in the list and shows a red alert on Home. <b>Payout history</b> lists every payout that went out, with the date, time, seller, IBAN and amount, marked <b>Moyasar</b> or <b>Manual</b> (Mark paid), and a CSV button.</p>\n\n<h3>Referrals <span class=\"mut\">(Owner)</span></h3>\n<p>Referral and influencer codes: <b>Create code</b>, <b>Copy link</b>, switch a code on or off, and see how many orders used it and what you owe the influencer. Press <b>Mark paid</b> after you pay them (it then counts as a cost in the Dashboard).</p>\n\n<h3>Email users</h3>\n<p>Send an email to your users. Choose <b>Everyone / Sellers only / Buyers only</b> and the kind: <b>Marketing</b> (only people who turned on \"Send me news and offers\", with an unsubscribe link) or <b>Important</b> (everyone chosen: use only for real service notices). Always press <b>Send a test to me</b> first, read it on your phone, then <b>Send to everyone chosen</b>. It cannot be undone.</p>\n\n<h3>Ads</h3>\n<p>Short video ads shown between videos. <b>Add an ad</b> (upload an MP4, choose where the button leads: a product, a seller or a web page). Choose how often: one ad every N videos (3 to 30). Switch Ads ON or OFF here (OFF at launch).</p>\n\n<h3>Promotions</h3>\n<p>Paid promotion of a product (it shows a \"Promoted\" label and appears more). <b>Create a promotion by hand</b>, <b>Cancel</b> one, or <b>change the price</b>. Keep seller-bought promotions OFF at launch.</p>\n\n<h3>Team <span class=\"mut\">(Owner)</span></h3>\n<p><b>Add a friend</b> to make a helper account: copy the invitation and send it privately. <b>New password</b> if they lose it, <b>Remove</b> to cut access at once. <b>What your friends did</b> shows the latest 60 actions with names and times.</p>\n\n<h2>4. Money rules to remember</h2>\n<ul>\n<li>Commission is <b>15%</b> of the item. The seller also keeps the shipping fee. Shipping is a fixed fee by size: small 20, medium 30, large 50 SAR.</li>\n<li>The seller ships within <b>5 days</b>. If not, the order is cancelled and the buyer is refunded automatically.</li>\n<li>An order becomes payable about <b>14 days after shipping</b> (or when received), after the 7-day report window.</li>\n<li>Moyasar takes about 2.74% + 1 SAR per payment and per refund. That is already inside the Dashboard profit.</li>\n<li><b>Tamara</b> (pay in 4) charges Casho <b>6.99% + 1.50 SAR per order</b>. The buyer pays nothing extra. Tamara is offered only for fixed-price items of <b>100 SAR or more</b>. The fee is counted in the Dashboard profit on completed orders (the fee on a refunded Tamara order is not counted, because it is not known).</li>\n<li>Item auctions: the card is only <b>held</b>. The winner is charged at the end; a failed card gives the next bidders a second chance.</li>\n</ul>\n\n<h2>5. Golden rules</h2>\n<ul>\n<li>Read before you act. Refunds, bans and removals affect real people.</li>\n<li>Write what you did in the ticket or claim note, so the next person understands.</li>\n<li>Never type or paste passwords, card numbers or API keys into a chat or a ticket.</li>\n<li>If you are not sure, leave it and ask the owner. Most things can wait an hour; money mistakes cannot be undone.</li>\n<li>Be kind in replies: Arabic first, then English if the user wrote in English.</li>\n</ul>\n\n<p class=\"mut\">More: <a href=\"guide-seller.html\">Seller guide</a> · <a href=\"guide-buyer.html\">Buyer guide</a></p>", "ar": "<h1>دليل إدارة كاشو</h1>\n<p class=\"mut\">للمالك وللفريق. أبقِ رابط الإدارة وكلمة المرور سرّيين.</p>\n\n<h2>١. الدخول ومن يرى ماذا</h2>\n<ul>\n<li>افتح صفحة الإدارة واكتب كلمة المرور. <b>المالك</b> يرى كل الأقسام. أما <b>المساعد</b> (صديق أضفته من <b>Team</b>) فيرى كل شيء <b>عدا</b>: Dashboard وMoney وRefunds وPayouts وReferrals وTeam، ومفاتيح التشغيل والقرارات المالية داخل Auctions وVehicles وProperties وSellers. وهذه مكتوب عليها <b>للمالك</b> أدناه. (يحصل المساعدون على Promotions وEmail users وAds.)</li>\n<li>يتحقق الخادم من الصلاحية عند كل ضغطة، فلا يستطيع المساعد الوصول لأقسام المالك.</li>\n<li>كل ما يفعله المساعد يُسجَّل، ويقرأه المالك في <b>Team ثم What your friends did</b>.</li>\n<li>لا تشارك كلمة المرور ولا ترسلها في محادثة. لإعطاء صديق صلاحية استخدم <b>Team ثم Add a friend</b> (ينشئ له كلمة مرور خاصة).</li>\n<li><b>كيف الصفحة مرتبة.</b> <b>القائمة</b> على اليسار (وفي الجوال زر <b>Menu</b> في الأعلى) تجمع الأقسام حسب العمل: <b>Money</b> و<b>Orders</b> و<b>Listings</b> و<b>People</b> و<b>Safety and support</b>. والصفحة الأولى هي <b>Home</b>. و<b>الرقم الأحمر</b> بجانب القسم يعني أن هذا العدد من الأمور ينتظر هناك، ويتجدد كل دقيقة.</li>\n</ul>\n\n<h2>٢. كل يوم بهذا الترتيب</h2>\n<ol>\n<li><b>Home</b>: اقرأ الصندوق الأحمر <b>Something is wrong</b> إن وُجد، ثم <b>Needs you now</b>. كل مربع يفتح القسم الذي فيه العمل.</li>\n<li><b>Reports</b>: عالج البلاغات الجديدة أولًا. المحتوى المسيء أو المخالف لا يبقى.</li>\n<li><b>Claims</b>: مشتري يقول إن هناك مشكلة في طلبه.</li>\n<li><b>Tickets</b>: ردّ على رسائل الدعم.</li>\n<li><b>Vehicles</b> و<b>Properties</b> (إن كانت مفعّلة): وافق أو ارفض الإعلانات الجديدة.</li>\n<li><b>Sellers</b> و<b>Badges</b>: وافق على آيبان البائعين الجدد وطلبات الشارة.</li>\n<li><b>Refunds</b> (للمالك): إذا كان الرقم الأحمر ليس صفرًا فافتحه واضغط <b>Refund now</b> (أو <b>Refund all waiting</b>) ثم اقرأ النتيجة.</li>\n<li><b>Payouts</b> (للمالك): ادفع للبائعين الذين اكتملت طلباتهم ثم علّمها مدفوعة.</li>\n</ol>\n\n<h2>٣. ماذا يفعل كل قسم</h2>\n\n<h3>Home</h3>\n<p>الصفحة الأولى. إذا فشلت المدفوعات يظهر في الأعلى صندوق أحمر <b>Something is wrong</b> (دفعة بطاقة أو Tamara لم تكتمل، أو تأكيد Tamara يفشل باستمرار، أو استرداد لا يمر، أو توقف دالة الدفع). وتصلك أيضًا رسالة بريد في المرة الأولى. أصلح الأمر أو اسأل المطوّر ثم اضغط <b>Resolved</b>. والمشكلة نفسها تُعدّ تنبيهًا واحدًا لمدة ٦ ساعات. وتحته <b>Needs you now</b> مربعات بأرقام (استردادات ومطالبات وبلاغات وتذاكر وطلبات شارة وصور مُبلَّغ عنها وبائعون للدفع واقتراحات جديدة): اضغط مربعًا لفتح قسمه. وفي الأسفل يرى المالك <b>رسومًا بيانية لآخر ٣٠ يومًا</b>: الإيراد والطلبات المدفوعة.</p>\n\n<h3>Dashboard <span class=\"mut\">(للمالك)</span></h3>\n<p>الصورة الكاملة: المستخدمون والمنتجات والطلبات والإيراد ورسوم Moyasar وTamara وخصومات الإحالة ونصيب المؤثرين و<b>ربحك</b>. وفي الأعلى <b>رسوم بيانية لآخر ٣٠ يومًا</b> تعرض الإيراد والطلبات المدفوعة والمستخدمين الجدد لكل يوم (اضغط عمودًا لترى رقمه أو اضغط <b>Table</b> لكل الأيام). وفي الأسفل <b>ملف المحاسب</b>: اختر الفترة واضغط <b>Download CSV</b> (أو <b>Show totals only</b>). ويمكنك أيضًا كتابة <b>تكاليفك ودخلك</b> (مثل فاتورة AWS) ليكتمل ملف المحاسب.</p>\n\n<h3>Tickets</h3>\n<p>رسائل المستخدمين من <b>الحساب ثم تواصل مع الدعم</b>. اضغط <b>Send reply</b> للرد (يراه المستخدم باسم «Casho support») و<b>Close ticket</b> عند الانتهاء. الرد <b>لا</b> يغلق التذكرة، فيمكنك الرد أكثر من مرة ويبقى السجل. <b>Reopen</b> يعيدها.</p>\n\n<h3>Claims</h3>\n<p>مشتري يقول إن هناك مشكلة بعد التسليم (أو أن الطرد لم يصل). افتح المطالبة واقرأ <b>صور المشتري ورسائله</b> وصورة شحن البائع، ثم:</p>\n<ul>\n<li><b>Approve (buyer returns the item)</b>: يعيد المشتري المنتج، ويُسترد المبلغ عندما يؤكد البائع الوصول.</li>\n<li><b>Reject</b>: تُغلق المطالبة ويُدفع للبائع كالمعتاد.</li>\n<li><b>Refund now (fallback)</b> وتبويب <b>Refunds</b> (للمالك فقط): يعرض ما ينتظر الاسترداد وما تم استرداده؛ استخدمه إذا بدا الاسترداد عالقًا.</li>\n</ul>\n<p>استخدم <b>Find</b> للبحث برقم الطلب. كن عادلًا واكتب ملاحظات قصيرة لأن الأمر يخص المال.</p>\n\n<h3>Photos</h3>\n<p>كل صورة منتج تُفحص تلقائيًا. والصور التي بدت غير آمنة تنتظر هنا (بعضها سليم مثل ملابس السباحة). <b>Looks fine</b> يعتمد الصورة. <b>Remove this photo</b> يزيل هذه الصورة فقط ويراسل البائع ليضيف غيرها. <b>Remove listing</b> يُنزل الإعلان كله. لا يُخفى شيء حتى يقرر شخص.</p>\n\n<h3>Reports</h3>\n<p>يبلغ المستخدمون عن البثوث والفيديوهات والتعليقات والرسائل والتقييمات والحسابات والإعلانات. لكل بلاغ يمكنك <b>Dismiss</b> (لا مخالفة) أو حذف المحتوى (<b>Remove video / comment / message / listing</b>) أو <b>Ban account</b> أو <b>Mark handled</b>. إن لم تكن متأكدًا فاحذف المحتوى أولًا ثم قرر في الحساب.</p>\n\n<h3>Banned</h3>\n<p>قائمة الحسابات المحظورة مع <b>Unban</b>. المحظور لا يستطيع استخدام التطبيق.</p>\n\n<h3>Words</h3>\n<p>قائمة الكلمات الممنوعة في الدردشة والتعليقات. <b>Add</b> لإضافة كلمة مع اختيار <b>Whole word only</b> (أأمن) أو <b>Anywhere inside a word</b> (أقوى لكن قد يمنع كلمات بريئة). <b>Remove</b> للحذف.</p>\n\n<h3>Badges</h3>\n<p>طلبات الشارة الزرقاء. افحص الإثبات ثم <b>Approve</b> أو <b>Reject</b>.</p>\n\n<h3>Sellers</h3>\n<p>كل البائعين. اضغط <b>Verify IBAN</b> بعد التأكد أن الآيبان باسم البائع نفسه (صورة الإثبات موجودة). <b>Remove verification</b> للتراجع. ويمكنك أيضًا <b>إيقاف</b> البائع (يتوقف بثه ومبيعاته) وتعديل إعداداته. لا يُدفع للبائع قبل توثيق الآيبان. وفي الأعلى ترى <b>Sellers with strikes</b> (بسبب إلغاء طلبات مدفوعة أو إلغاء مزاد بعد مزايدة أو حذف منتج): <b>Clear strikes</b> يصفّر إنذارات البائع بعد التحدث معه.</p>\n\n<h3>Money <span class=\"mut\">(للمالك)</span></h3>\n<p>أموال العملاء لدى كاشو، وما يستحقه البائعون، وتقدير رسوم <b>Moyasar وTamara</b>، و<b>ربحك</b>، ومفتاح زر <b>Support Casho</b> (أبقه مغلقًا عند الإطلاق).</p>\n\n<h3>Suggestions</h3>\n<p>صندوق الاقتراحات من المستخدمين. علّم كل اقتراح <b>Read</b> أو <b>Done</b> أو <b>Delete</b>. الأفكار الجيدة هنا نصيحة مجانية للمنتج.</p>\n\n<h3>Products</h3>\n<p>ابحث عن أي منتج برقمه (يراه المستخدم <b>Product #12345678</b> ويستطيع نسخه) أو باسمه. <b>Remove product</b> يحذفه (للمنتجات الممنوعة: أسلحة وكحول وأدوية ومقلّد). <b>Restore</b> يعيده. حذف منتج عليه مزاد جارٍ يلغي المزاد ويعطي البائع إنذارًا، فتأكد جيدًا.</p>\n\n<h3>Auctions</h3>\n<p>مزادات المنتجات الجارية. ومفتاح تشغيل مزادات المنتجات للمالك.</p>\n\n<h3>Vehicles</h3>\n<p>إعلانات السيارات الجديدة تنتظر هنا <b>الموافقة</b> (دفع البائع رسم الإعلان). <b>Approve</b> أو <b>Reject</b> (يمكن للبائع تعديله وإرساله مجانًا، والرسوم غير مستردة). وهنا أيضًا <b>Vehicle deals in progress</b> (مزادات العربون): عند فشل صفقة اختر المخطئ (<b>Buyer at fault</b> أو <b>No fault: refund buyer</b>) فتُطبَّق النتيجة (استرداد أو إنذار أو عربون مستحق). و<b>Deposits owed to sellers</b>: ادفعها ثم اضغط <b>Mark paid</b>. مفاتيح التشغيل للمالك. أبقِ مزادات السيارات مغلقة عند الإطلاق.</p>\n\n<h3>Properties</h3>\n<p>الفكرة نفسها للعقارات: <b>Approve</b> أو <b>Reject + refund fee</b> (افحص الصور ورقم الترخيص ودبوس الخريطة)، و<b>Take down</b> لاحقًا عند الحاجة. <b>How properties work</b> و<b>Watch the video</b> مساعدان قصيران. كاشو تعرّف المشتري بالبائع فقط، والصفقة تتم خارج التطبيق.</p>\n\n<h3>Orders</h3>\n<p>كل الطلبات مع حالتها. <b>Find order</b> برقم الطلب، وتصفية بالحالة، و<b>Download CSV</b> للمحاسب.</p>\n\n<h3>Refunds <span class=\"mut\">(للمالك)</span></h3>\n<p>الطلبات التي تنتظر الاسترداد للمشتري (بطاقة أو Apple Pay أو Tamara)، ولكل طلب زر <b>Refund now</b>، وزر <b>Refund all waiting</b>. بعد الضغط يظهر صندوق لكل طلب: <b>Refunded</b> أو <b>Not refunded</b> مع السبب. و<b>Refunded lately</b> يعرض آخر الاستردادات. وتُعاد محاولة الاسترداد تلقائيًا كل دقيقة.</p>\n\n<h3>Payouts <span class=\"mut\">(للمالك)</span></h3>\n<p>ما تدين به كاشو للبائعين عن الطلبات المكتملة. حوّل المبلغ من البنك إلى آيبان البائع ثم اضغط <b>Mark paid</b>. و<b>Download this list (CSV)</b> يعطيك القائمة للبنك. ادفع فقط للآيبان الموثّق. وعند تفعيل Moyasar Payouts يظهر لكل بائع زر <b>Pay with Moyasar</b>: يرسل المبلغ من حسابك البنكي تلقائياً ثم يصله بريد إلكتروني. تظهر الحالة (تم الدفع، في الطريق، فشل) تحت <b>Paid through Moyasar</b> وتتحدث تلقائياً؛ وإذا فشلت الدفعة تعود الطلبات إلى القائمة ويظهر تنبيه أحمر في الصفحة الرئيسية. ويعرض <b>Payout history</b> كل دفعة خرجت، بتاريخها ووقتها واسم البائع والآيبان والمبلغ، مع علامة <b>Moyasar</b> أو <b>Manual</b> (Mark paid)، وزر لتنزيل CSV.</p>\n\n<h3>Referrals <span class=\"mut\">(للمالك)</span></h3>\n<p>رموز الإحالة والمؤثرين: <b>Create code</b> و<b>Copy link</b> وتشغيل الرمز أو إيقافه، وعدد الطلبات التي استخدمته وما تدين به للمؤثر. اضغط <b>Mark paid</b> بعد أن تدفع له (ثم يُحسب تكلفة في Dashboard).</p>\n\n<h3>Email users</h3>\n<p>أرسل بريدًا لمستخدميك. اختر <b>Everyone / Sellers only / Buyers only</b> ونوعه: <b>Marketing</b> (فقط من فعّل «أرسل لي الأخبار والعروض» وفيه رابط إلغاء الاشتراك) أو <b>Important</b> (كل من اخترت: للإشعارات الخدمية الحقيقية فقط). اضغط دائمًا <b>Send a test to me</b> أولًا واقرأه على هاتفك ثم <b>Send to everyone chosen</b>. لا يمكن التراجع.</p>\n\n<h3>Ads</h3>\n<p>إعلانات فيديو قصيرة تظهر بين الفيديوهات. <b>Add an ad</b> (ارفع MP4 واختر وجهة الزر: منتج أو بائع أو صفحة ويب). واختر تكرارها: إعلان كل N فيديو (من ٣ إلى ٣٠). شغّل الإعلانات أو أوقفها من هنا (متوقفة عند الإطلاق).</p>\n\n<h3>Promotions</h3>\n<p>ترويج مدفوع لمنتج (تظهر عليه علامة «Promoted» ويظهر أكثر). <b>Create a promotion by hand</b> أو <b>Cancel</b> أو <b>تغيير السعر</b>. أبقِ الترويج الذي يشتريه البائعون متوقفًا عند الإطلاق.</p>\n\n<h3>Team <span class=\"mut\">(للمالك)</span></h3>\n<p><b>Add a friend</b> لإنشاء حساب مساعد: انسخ الدعوة وأرسلها بشكل خاص. <b>New password</b> إن فقدها، و<b>Remove</b> لقطع الوصول فورًا. و<b>What your friends did</b> يعرض آخر ٦٠ إجراءً بالأسماء والأوقات.</p>\n\n<h2>٤. قواعد مالية تذكّرها</h2>\n<ul>\n<li>العمولة <b>١٥٪</b> من سعر المنتج. ويحتفظ البائع أيضًا برسم الشحن. والشحن رسم ثابت حسب الحجم: صغير ٢٠ ومتوسط ٣٠ وكبير ٥٠ ريالًا.</li>\n<li>يشحن البائع خلال <b>٥ أيام</b>، وإلا يُلغى الطلب ويُسترد للمشتري تلقائيًا.</li>\n<li>يصبح الطلب مستحق الدفع بعد نحو <b>١٤ يومًا من الشحن</b> (أو عند الاستلام) وبعد نافذة الإبلاغ ٧ أيام.</li>\n<li>تأخذ Moyasar نحو ٢٫٧٤٪ + ١ ريال عن كل دفعة وكل استرداد، وهذا محسوب أصلًا في ربح Dashboard.</li>\n<li>تأخذ <b>Tamara</b> (الدفع على ٤ دفعات) من كاشو <b>٦٫٩٩٪ + ١٫٥٠ ريال عن كل طلب</b>، ولا يدفع المشتري أي زيادة. وتظهر Tamara فقط للمنتجات ذات السعر الثابت التي إجماليها <b>١٠٠ ريال أو أكثر</b>. ورسومها محسوبة في ربح Dashboard على الطلبات المكتملة (ولا تُحسب الرسوم على طلب Tamara المسترد لأنها غير معروفة).</li>\n<li>مزادات المنتجات: البطاقة <b>تُحجز</b> فقط. يُخصم من الفائز عند النهاية، وفشل البطاقة يعطي المزايدين التاليين فرصة ثانية.</li>\n</ul>\n\n<h2>٥. قواعد ذهبية</h2>\n<ul>\n<li>اقرأ قبل أن تتصرف. الاسترداد والحظر والحذف تمس أشخاصًا حقيقيين.</li>\n<li>اكتب ما فعلته في ملاحظة التذكرة أو المطالبة ليفهم الشخص التالي.</li>\n<li>لا تكتب ولا تلصق كلمات مرور أو أرقام بطاقات أو مفاتيح في محادثة أو تذكرة.</li>\n<li>إن لم تكن متأكدًا فاترك الأمر واسأل المالك. أغلب الأمور تنتظر ساعة، وأخطاء المال لا يمكن التراجع عنها.</li>\n<li>كن لطيفًا في الردود: العربية أولًا ثم الإنجليزية إذا كتب المستخدم بالإنجليزية.</li>\n</ul>"}, "helper": {"en": "<h1>Casho team guide</h1>\n<p class=\"mut\">For friends who help run Casho. Keep your admin password private.</p>\n\n<h2>1. What you can do</h2>\n<ul>\n<li>You can use almost everything: support, claims, reports, bans, words, badges, sellers, suggestions, products, auctions, vehicles, properties, orders, promotions, emails and ads.</li>\n<li>You <b>cannot</b> see the money pages: <b>Dashboard, Money, Refunds, Payouts and Referrals</b>, and <b>Team</b>. They hold sensitive numbers and decisions that only the owner makes.</li>\n<li>Everything you do is saved in a log with your name and the time, for everyone's safety.</li>\n<li>Never share your password and never type it in a chat. If you lose it, ask the owner for a new one.</li>\n<li><b>How the page is organised.</b> The <b>menu</b> on the left (on a phone: the <b>Menu</b> button at the top) groups the tabs by job. The first page is <b>Home</b>. A <b>red number</b> next to a tab means that many things are waiting there.</li>\n</ul>\n\n<h2>2. Every day, in this order</h2>\n<ol>\n<li><b>Home</b>: look at <b>Needs you now</b>. Each tile opens the tab where the work is.</li>\n<li><b>Reports</b>: handle new reports first. Offensive or illegal content should not stay up.</li>\n<li><b>Claims</b>: buyers who say there is a problem with an order.</li>\n<li><b>Tickets</b>: answer support messages.</li>\n<li><b>Vehicles</b> and <b>Properties</b>: approve or reject new listings.</li>\n<li><b>Sellers</b> and <b>Badges</b>: check new IBANs and badge requests.</li>\n<li><b>Suggestions</b>: read the new ones.</li>\n</ol>\n\n<h2>3. What each tab does</h2>\n<h3>Home</h3>\n<p>The first page. It shows only what is waiting for a person: claims, reports, tickets, badge requests, flagged photos and suggestions. Tap a tile to open that tab. (The money tiles are for the owner.)</p>\n\n<h3>Tickets</h3>\n<p>Messages users send from <b>Profile, Contact support</b>. Press <b>Send reply</b> to answer (the user sees it as \"Casho support\") and <b>Close ticket</b> when finished. Replying does <b>not</b> close the ticket, so you can reply many times; the history is kept. <b>Reopen</b> brings it back.</p>\n\n<h3>Claims</h3>\n<p>A buyer says there is a problem after delivery (or the parcel did not arrive). Open the claim, read the buyer's <b>photos and messages</b> and the seller's tracking photo, then:</p>\n<ul>\n<li><b>Approve (buyer returns the item)</b>: the buyer sends it back, and the money is refunded when the seller confirms it arrived.</li>\n<li><b>Reject</b>: the claim is closed and the seller is paid as normal.</li>\n<li>Refunds are paid by the owner. If a refund seems stuck, tell the owner.</li>\n</ul>\n<p>Use <b>Find</b> to look up an order by its number. Be fair and write short notes: money is involved.</p>\n\n<h3>Photos</h3>\n<p>Every listing photo is checked automatically. Photos that looked unsafe wait here (some are fine, like swimwear). <b>Looks fine</b> clears it. <b>Remove this photo</b> takes only that photo off and emails the seller to add another. <b>Remove listing</b> takes the whole listing down. Nothing is hidden until a person decides.</p>\n\n<h3>Reports</h3>\n<p>Users report lives, videos, comments, messages, reviews, profiles and listings. For each report you can <b>Dismiss</b> (nothing wrong), take the content down (<b>Remove video / comment / message / listing</b>), <b>Ban account</b>, or <b>Mark handled</b>. When unsure, take the content down first and decide about the account after.</p>\n\n<h3>Banned</h3>\n<p>The list of banned accounts, with <b>Unban</b>. A banned person cannot use the app.</p>\n\n<h3>Words</h3>\n<p>The blocked-words list for chats and comments. <b>Add</b> a word and choose <b>Whole word only</b> (safer) or <b>Anywhere inside a word</b> (stronger, but may block innocent words). <b>Remove</b> deletes it.</p>\n\n<h3>Badges</h3>\n<p>Requests for the blue verified badge. Check the proof, then <b>Approve</b> or <b>Reject</b>.</p>\n\n<h3>Sellers</h3>\n<p>All sellers. Use <b>Verify IBAN</b> after checking that the IBAN is in the seller's own name (the proof photo is there). <b>Remove verification</b> undoes it. You can also <b>suspend</b> a seller (their live and sales stop). A seller cannot be paid before the IBAN is verified. At the top you see <b>Sellers with strikes</b>: <b>Clear strikes</b> resets a seller after you have talked to them.</p>\n\n<h3>Suggestions</h3>\n<p>The suggestion box from users. Mark each one <b>Read</b>, <b>Done</b> or <b>Delete</b>. Good ideas here are free product advice.</p>\n\n<h3>Products</h3>\n<p>Find any product by its number (the user sees it as <b>Product #12345678</b> and can copy it) or by name. <b>Remove product</b> takes it down (use for banned items: weapons, alcohol, medicine, fakes). <b>Restore</b> puts it back. Removing a product with a running auction cancels it and gives the seller a strike, so be sure.</p>\n\n<h3>Auctions</h3>\n<p>Running item auctions. The owner has the on/off switch for item auctions.</p>\n\n<h3>Vehicles</h3>\n<p>New car listings wait here for <b>approval</b> (the seller already paid the listing fee). <b>Approve</b>, or <b>Reject</b> (the seller can fix it and send it again for free; the fee is never refunded). You can also take a listing down later. Deposit deals, deposit payments and the on/off switches are handled by the owner.</p>\n\n<h3>Properties</h3>\n<p>Same idea for properties: <b>Approve</b> or <b>Reject + refund fee</b> (check the photos, the licence number and the map pin), <b>Take down</b> later if needed. <b>How properties work</b> and <b>Watch the video</b> are short helpers. Casho only introduces buyer and seller; the deal happens outside the app.</p>\n\n<h3>Orders</h3>\n<p>Every order with its status. <b>Find order</b> by number, filter by status, and <b>Download CSV</b> for the accountant.</p>\n\n<h3>Promotions</h3>\n<p>Paid promotion of a product (it shows a \"Promoted\" label and appears more). <b>Create a promotion by hand</b>, <b>Cancel</b> one, or <b>change the price</b>. Keep seller-bought promotions OFF at launch.</p>\n\n<h3>Email users</h3>\n<p>Send an email to your users. Choose <b>Everyone / Sellers only / Buyers only</b> and the kind: <b>Marketing</b> (only people who turned on \"Send me news and offers\", with an unsubscribe link) or <b>Important</b> (everyone chosen: use only for real service notices). Always press <b>Send a test to me</b> first, read it on your phone, then <b>Send to everyone chosen</b>. It cannot be undone.</p>\n\n<h3>Ads</h3>\n<p>Short video ads shown between videos. <b>Add an ad</b> (upload an MP4, choose where the button leads: a product, a seller or a web page). Choose how often: one ad every N videos (3 to 30). Switch Ads ON or OFF here (OFF at launch).</p>\n\n<h2>4. Be careful with these</h2>\n<ul>\n<li><b>Email users</b>: a mass email cannot be undone. Always send a test to yourself first, and ask the owner before you send to everyone.</li>\n<li><b>Claims, bans and removals</b> affect real people and real money. Read first, write a short note, and ask the owner when unsure.</li>\n</ul>\n\n<h2>5. Golden rules</h2>\n<ul>\n<li>Read before you act. Most things can wait an hour; mistakes with money or bans are hard to undo.</li>\n<li>Write what you did in the ticket or claim note, so the next person understands.</li>\n<li>Never type or paste passwords, card numbers or API keys into a chat or a ticket.</li>\n<li>Be kind in replies: Arabic first, then English if the user wrote in English.</li>\n</ul>", "ar": "<h1>دليل فريق كاشو</h1>\n<p class=\"mut\">للأصدقاء الذين يساعدون في إدارة كاشو. أبقِ كلمة مرورك سرّية.</p>\n\n<h2>١. ماذا تستطيع أن تفعل</h2>\n<ul>\n<li>تستطيع استخدام معظم الأقسام: الدعم والمطالبات والبلاغات والحظر والكلمات والشارات والبائعين والاقتراحات والمنتجات والمزادات والسيارات والعقارات والطلبات والترويج والبريد والإعلانات.</li>\n<li><b>لا تستطيع</b> رؤية الصفحات المالية: <b>Dashboard وMoney وRefunds وPayouts وReferrals</b>، ولا <b>Team</b>. فهي تحوي أرقامًا وقرارات حساسة يتخذها المالك فقط.</li>\n<li>كل ما تفعله يُحفظ في سجل باسمك ووقته، لسلامة الجميع.</li>\n<li>لا تشارك كلمة المرور ولا تكتبها في محادثة. وإن فقدتها فاطلب من المالك كلمة جديدة.</li>\n<li><b>كيف الصفحة مرتبة.</b> <b>القائمة</b> على اليسار (وفي الجوال زر <b>Menu</b> في الأعلى) تجمع الأقسام حسب العمل. والصفحة الأولى هي <b>Home</b>. و<b>الرقم الأحمر</b> بجانب القسم يعني أن هذا العدد من الأمور ينتظر هناك.</li>\n</ul>\n\n<h2>٢. كل يوم بهذا الترتيب</h2>\n<ol>\n<li><b>Home</b>: انظر <b>Needs you now</b>. كل مربع يفتح القسم الذي فيه العمل.</li>\n<li><b>Reports</b>: عالج البلاغات الجديدة أولًا. المحتوى المسيء أو المخالف لا يبقى.</li>\n<li><b>Claims</b>: مشتري يقول إن هناك مشكلة في طلبه.</li>\n<li><b>Tickets</b>: ردّ على رسائل الدعم.</li>\n<li><b>Vehicles</b> و<b>Properties</b>: وافق أو ارفض الإعلانات الجديدة.</li>\n<li><b>Sellers</b> و<b>Badges</b>: افحص الآيبان الجديد وطلبات الشارة.</li>\n<li><b>Suggestions</b>: اقرأ الجديد منها.</li>\n</ol>\n\n<h2>٣. ماذا يفعل كل قسم</h2>\n<h3>Home</h3>\n<p>الصفحة الأولى. تعرض فقط ما ينتظر شخصًا: مطالبات وبلاغات وتذاكر وطلبات شارة وصور مُبلَّغ عنها واقتراحات. اضغط مربعًا لفتح قسمه. (مربعات المال للمالك.)</p>\n\n<h3>Tickets</h3>\n<p>رسائل المستخدمين من <b>الحساب ثم تواصل مع الدعم</b>. اضغط <b>Send reply</b> للرد (يراه المستخدم باسم «Casho support») و<b>Close ticket</b> عند الانتهاء. الرد <b>لا</b> يغلق التذكرة، فيمكنك الرد أكثر من مرة ويبقى السجل. <b>Reopen</b> يعيدها.</p>\n\n<h3>Claims</h3>\n<p>مشتري يقول إن هناك مشكلة بعد التسليم (أو أن الطرد لم يصل). افتح المطالبة واقرأ <b>صور المشتري ورسائله</b> وصورة شحن البائع، ثم:</p>\n<ul>\n<li><b>Approve (buyer returns the item)</b>: يعيد المشتري المنتج، ويُسترد المبلغ عندما يؤكد البائع الوصول.</li>\n<li><b>Reject</b>: تُغلق المطالبة ويُدفع للبائع كالمعتاد.</li>\n<li>الاسترداد يدفعه المالك. إذا بدا الاسترداد عالقًا فأخبر المالك.</li>\n</ul>\n<p>استخدم <b>Find</b> للبحث برقم الطلب. كن عادلًا واكتب ملاحظات قصيرة لأن الأمر يخص المال.</p>\n\n<h3>Photos</h3>\n<p>كل صورة منتج تُفحص تلقائيًا. والصور التي بدت غير آمنة تنتظر هنا (بعضها سليم مثل ملابس السباحة). <b>Looks fine</b> يعتمد الصورة. <b>Remove this photo</b> يزيل هذه الصورة فقط ويراسل البائع ليضيف غيرها. <b>Remove listing</b> يُنزل الإعلان كله. لا يُخفى شيء حتى يقرر شخص.</p>\n\n<h3>Reports</h3>\n<p>يبلغ المستخدمون عن البثوث والفيديوهات والتعليقات والرسائل والتقييمات والحسابات والإعلانات. لكل بلاغ يمكنك <b>Dismiss</b> (لا مخالفة) أو حذف المحتوى (<b>Remove video / comment / message / listing</b>) أو <b>Ban account</b> أو <b>Mark handled</b>. إن لم تكن متأكدًا فاحذف المحتوى أولًا ثم قرر في الحساب.</p>\n\n<h3>Banned</h3>\n<p>قائمة الحسابات المحظورة مع <b>Unban</b>. المحظور لا يستطيع استخدام التطبيق.</p>\n\n<h3>Words</h3>\n<p>قائمة الكلمات الممنوعة في الدردشة والتعليقات. <b>Add</b> لإضافة كلمة مع اختيار <b>Whole word only</b> (أأمن) أو <b>Anywhere inside a word</b> (أقوى لكن قد يمنع كلمات بريئة). <b>Remove</b> للحذف.</p>\n\n<h3>Badges</h3>\n<p>طلبات الشارة الزرقاء. افحص الإثبات ثم <b>Approve</b> أو <b>Reject</b>.</p>\n\n<h3>Sellers</h3>\n<p>كل البائعين. اضغط <b>Verify IBAN</b> بعد التأكد أن الآيبان باسم البائع نفسه (صورة الإثبات موجودة). <b>Remove verification</b> للتراجع. ويمكنك أيضًا <b>إيقاف</b> البائع (يتوقف بثه ومبيعاته). لا يُدفع للبائع قبل توثيق الآيبان. وفي الأعلى ترى <b>Sellers with strikes</b>: <b>Clear strikes</b> يصفّر إنذارات البائع بعد التحدث معه.</p>\n\n<h3>Suggestions</h3>\n<p>صندوق الاقتراحات من المستخدمين. علّم كل اقتراح <b>Read</b> أو <b>Done</b> أو <b>Delete</b>. الأفكار الجيدة هنا نصيحة مجانية للمنتج.</p>\n\n<h3>Products</h3>\n<p>ابحث عن أي منتج برقمه (يراه المستخدم <b>Product #12345678</b> ويستطيع نسخه) أو باسمه. <b>Remove product</b> يحذفه (للمنتجات الممنوعة: أسلحة وكحول وأدوية ومقلّد). <b>Restore</b> يعيده. حذف منتج عليه مزاد جارٍ يلغي المزاد ويعطي البائع إنذارًا، فتأكد جيدًا.</p>\n\n<h3>Auctions</h3>\n<p>مزادات المنتجات الجارية. ومفتاح تشغيل مزادات المنتجات للمالك.</p>\n\n<h3>Vehicles</h3>\n<p>إعلانات السيارات الجديدة تنتظر هنا <b>الموافقة</b> (دفع البائع رسم الإعلان). <b>Approve</b> أو <b>Reject</b> (يمكن للبائع تعديله وإرساله مجانًا، والرسوم غير مستردة). ويمكنك إنزال إعلان لاحقًا. أما صفقات العربون ودفع العرابين ومفاتيح التشغيل فيتولاها المالك.</p>\n\n<h3>Properties</h3>\n<p>الفكرة نفسها للعقارات: <b>Approve</b> أو <b>Reject + refund fee</b> (افحص الصور ورقم الترخيص ودبوس الخريطة)، و<b>Take down</b> لاحقًا عند الحاجة. <b>How properties work</b> و<b>Watch the video</b> مساعدان قصيران. كاشو تعرّف المشتري بالبائع فقط، والصفقة تتم خارج التطبيق.</p>\n\n<h3>Orders</h3>\n<p>كل الطلبات مع حالتها. <b>Find order</b> برقم الطلب، وتصفية بالحالة، و<b>Download CSV</b> للمحاسب.</p>\n\n<h3>Promotions</h3>\n<p>ترويج مدفوع لمنتج (تظهر عليه علامة «Promoted» ويظهر أكثر). <b>Create a promotion by hand</b> أو <b>Cancel</b> أو <b>تغيير السعر</b>. أبقِ الترويج الذي يشتريه البائعون متوقفًا عند الإطلاق.</p>\n\n<h3>Email users</h3>\n<p>أرسل بريدًا لمستخدميك. اختر <b>Everyone / Sellers only / Buyers only</b> ونوعه: <b>Marketing</b> (فقط من فعّل «أرسل لي الأخبار والعروض» وفيه رابط إلغاء الاشتراك) أو <b>Important</b> (كل من اخترت: للإشعارات الخدمية الحقيقية فقط). اضغط دائمًا <b>Send a test to me</b> أولًا واقرأه على هاتفك ثم <b>Send to everyone chosen</b>. لا يمكن التراجع.</p>\n\n<h3>Ads</h3>\n<p>إعلانات فيديو قصيرة تظهر بين الفيديوهات. <b>Add an ad</b> (ارفع MP4 واختر وجهة الزر: منتج أو بائع أو صفحة ويب). واختر تكرارها: إعلان كل N فيديو (من ٣ إلى ٣٠). شغّل الإعلانات أو أوقفها من هنا (متوقفة عند الإطلاق).</p>\n\n<h2>٤. احذر في هذه</h2>\n<ul>\n<li><b>Email users</b>: لا يمكن التراجع عن بريد جماعي. أرسل دائمًا تجربة لنفسك أولًا، واسأل المالك قبل الإرسال للجميع.</li>\n<li><b>المطالبات والحظر والحذف</b> تمس أشخاصًا حقيقيين ومالًا حقيقيًا. اقرأ أولًا واكتب ملاحظة قصيرة واسأل المالك عند الشك.</li>\n</ul>\n\n<h2>٥. قواعد ذهبية</h2>\n<ul>\n<li>اقرأ قبل أن تتصرف. أغلب الأمور تنتظر ساعة، وأخطاء المال والحظر يصعب التراجع عنها.</li>\n<li>اكتب ما فعلته في ملاحظة التذكرة أو المطالبة ليفهم الشخص التالي.</li>\n<li>لا تكتب ولا تلصق كلمات مرور أو أرقام بطاقات أو مفاتيح في محادثة أو تذكرة.</li>\n<li>كن لطيفًا في الردود: العربية أولًا ثم الإنجليزية إذا كتب المستخدم بالإنجليزية.</li>\n</ul>"}};   // owner guide and helper guide, English and Arabic

function openLightbox(urls, start = 0) {
  let i = start, scale = 1, x = 0, y = 0, drag = null;
  const img = el("img", { class: "lbimg", draggable: "false", alt: "" }), label = el("span", {});
  const apply = () => { img.style.transform = `translate(${x}px,${y}px) scale(${scale})`; label.textContent = `${i + 1} / ${urls.length} · ${Math.round(scale * 100)}%`; };
  const reset = () => { scale = 1; x = y = 0; apply(); };
  const set = (n) => { i = (n + urls.length) % urls.length; img.src = urls[i]; reset(); };
  const zoom = (f) => { scale = Math.min(8, Math.max(1, scale * f)); if (scale === 1) x = y = 0; apply(); };
  const close = () => { document.removeEventListener("keydown", key); box.remove(); };
  const key = (e) => { if (e.key === "Escape") close(); else if (e.key === "ArrowRight") set(i + 1); else if (e.key === "ArrowLeft") set(i - 1); else if (e.key === "+" || e.key === "=") zoom(1.4); else if (e.key === "-") zoom(1 / 1.4); else if (e.key === "0") reset(); };
  const stage = el("div", { class: "lbstage" }, img);
  stage.addEventListener("wheel", (e) => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
  stage.addEventListener("pointerdown", (e) => { drag = { x: e.clientX - x, y: e.clientY - y }; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener("pointermove", (e) => { if (drag && scale > 1) { x = e.clientX - drag.x; y = e.clientY - drag.y; apply(); } });
  stage.addEventListener("pointerup", () => { drag = null; });
  stage.addEventListener("dblclick", () => { if (scale > 1) reset(); else { scale = 2.5; apply(); } });
  const box = el("div", { class: "lb", role: "dialog", "aria-label": "Picture" }, stage, el("div", { class: "lbbar" },
    el("button", { onclick: () => zoom(1 / 1.4), title: "Zoom out (-)" }, "−"), el("button", { onclick: () => zoom(1.4), title: "Zoom in (+)" }, "+"), el("button", { onclick: reset }, "Fit"),
    urls.length > 1 ? [el("button", { onclick: () => set(i - 1) }, "‹ Previous"), el("button", { onclick: () => set(i + 1) }, "Next ›")] : null, label,
    el("button", { onclick: () => window.open(urls[i], "_blank", "noopener") }, "Open original"), el("button", { class: "primary", onclick: close }, "✕ Close")));
  document.addEventListener("keydown", key); document.body.append(box); set(i);
}

    const x = L + i * slot + (slot - bw) / 2, h = v ? Math.max(3, plotH * v / top) : 0, y = T + plotH - h, r = Math.min(4, h, bw / 2);
    const bar = s("path", { d: h ? `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${y + h} Z` : "", style: "fill:var(--bar)" });   // rounded top, square at the baseline
    const hit = s("rect", { x: L + i * slot, y: T, width: slot, height: plotH, style: "fill:transparent" });   // the hit area is the whole column, bigger than the bar
    const on = (e) => { bar.style.opacity = ".7"; tip.replaceChildren(el("b", {}, fmt(v)), el("span", { style: "opacity:.8" }, "  " + days[i])); tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 12, innerWidth - 170) + "px"; tip.style.top = (e.clientY - 40) + "px"; };
    hit.addEventListener("pointermove", on); hit.addEventListener("pointerdown", on);
    hit.addEventListener("pointerleave", () => { bar.style.opacity = ""; tip.style.display = "none"; });
    svg.append(bar, hit);
  });
  if (values[peak]) svg.append(s("text", { x: L + peak * slot + slot / 2, y: T - 1 > 8 ? T - 1 : 9, "text-anchor": peak > n / 2 ? "end" : "start", style: "fill:var(--fg);font-size:12px;font-weight:700" }, `${fmt(values[peak])} peak`));
  svg.append(s("text", { x: L, y: H - 6, "text-anchor": "start", style: "fill:var(--mut);font-size:12px" }, days[0].slice(5)), s("text", { x: W, y: H - 6, "text-anchor": "end", style: "fill:var(--mut);font-size:12px" }, days[n - 1].slice(5)));
  const table = el("table", { hidden: "" }, el("tr", {}, el("th", {}, "Day"), el("th", {}, title)), ...days.map((d, i) => el("tr", {}, el("td", {}, d), el("td", {}, fmt(values[i])))).reverse());
  const toggle = el("button", { onclick: () => { table.hidden = !table.hidden; toggle.textContent = table.hidden ? "Table" : "Hide table"; } }, "Table");
  return el("div", { class: "card chart" }, el("div", { style: "display:flex;justify-content:space-between;align-items:center;gap:8px" }, el("div", {}, el("div", { class: "mut" }, title), el("b", {}, fmt(sum)), el("span", { class: "mut" }, ` in the last ${n} days`)), toggle), svg, table);
}
const chartRow = (d, which) => el("div", { class: "grid2" },
  ...[["revenue", "Revenue", sar, (x) => compact(x / 100)], ["orders", "Paid orders", String, (x) => String(Math.round(x))], ["users", "New users", String, (x) => String(Math.round(x))]]
    .filter((c) => which.includes(c[0])).map(([k, name, f, a]) => chart(name, d.days, d[k], f, a)));

// "Go to a page": type a word, see the pages that deal with it, press Enter or click. The words per page are listed here (add a word when a new feature is added).
const FIND = [
  ["Home", "needs you now alerts systems uptime problems"],
  ["Dashboard", "charts revenue orders new users growth statistics"],
  ["Money", "money income commission fees revenue tamara moyasar balance costs profit"],
  ["Refunds", "refunds waiting refund all card money back failed refund"],
  ["Trades", "trades swap deposit dispute courier problem"],
  ["Payouts", "payouts pay seller iban moyasar mark paid history transfer statement bank"],
  ["Referrals", "referrals influencer codes discount promo code"],
  ["Orders", "orders order number invoice resend invoice pickup handover tracking shipping buyer seller"],
  ["Claims", "claims disputes refund request return returns damaged fake wrong item photos zoom in person handback"],
  ["Products", "products items listings remove product price quantity strike"],
  ["Auctions", "auctions bids bidders withdrawn strikes strike cancel auction"],
  ["Vehicles", "vehicles cars motorbikes listings"],
  ["Properties", "properties real estate houses apartments listings"],
  ["Ads", "ads advertising banners campaigns"],
  ["Promotions", "promotions promote boost paid promotion"],
  ["Sellers", "sellers suspend seller iban cr number stores accounts verification registration flag flagged document check ai strikes strike clear strikes buyer only convert ban"],
  ["Badges", "badges verification requests verified seller"],
  ["Banned", "banned ban unban blocked users"],
  ["Email users", "email users broadcast newsletter send email all users"],
  ["Team", "team helpers friends access staff"],
  ["Reports", "reports flags abuse remove product strike strikes warn seller report user chat"],
  ["Photos", "photos flagged image check ai hidden"],
  ["Tickets", "tickets support messages help customer service order help"],
  ["Suggestions", "suggestions ideas feedback"],
  ["Words", "words banned words bad words filter"],
  ["Guide", "guide help how to manual"],
];
let canOpen = () => true;
function findMatches(q) {
  const ws = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!ws.length) return [];
  return FIND.filter(([n]) => TABS[n] && canOpen(n)).map(([n, kw]) => {
    const words = (n + " " + kw).toLowerCase().split(/\s+/);
    let score = 0;
    for (const w of ws) { if (n.toLowerCase().startsWith(w)) score += 5; else if (words.some((x) => x === w)) score += 3; else if (words.some((x) => x.startsWith(w))) score += 2; else if ((n + " " + kw).toLowerCase().includes(w)) score += 1; else return [n, kw, -1]; }
    return [n, kw, score];
  }).filter((m) => m[2] > 0).sort((a, b) => b[2] - a[2]).slice(0, 6);
}
let findSel = 0, found = [];
function drawFind() {
  const box = $("findRes"); found = findMatches($("find").value.trim()); findSel = Math.min(findSel, Math.max(0, found.length - 1));
  box.hidden = !$("find").value.trim();
  box.replaceChildren(...(found.length ? found.map(([n, kw], i) => el("button", { type: "button", class: i === findSel ? "sel" : "", onclick: () => openFound(n) }, el("b", {}, n === "Home" ? "Home: needs you" : n), el("span", { class: "mut" }, kw.split(" ").slice(0, 8).join(" · ")))) : [el("div", { class: "mut", style: "padding:10px 12px" }, "No page found. Try another word.")]));
}
function openFound(n) { $("find").value = ""; $("findRes").hidden = true; show(n); }
$("find").addEventListener("input", () => { findSel = 0; drawFind(); });
$("find").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { findSel = Math.min(findSel + 1, found.length - 1); drawFind(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { findSel = Math.max(findSel - 1, 0); drawFind(); e.preventDefault(); }
  else if (e.key === "Enter" && found[findSel]) openFound(found[findSel][0]);
  else if (e.key === "Escape") { $("find").value = ""; $("findRes").hidden = true; }
});
document.addEventListener("click", (e) => { if (!$("findWrap").contains(e.target)) $("findRes").hidden = true; });
document.addEventListener("keydown", (e) => { if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "") && secret) { e.preventDefault(); $("find").focus(); } });
// ↻ Refresh: reload the data of the page you are on (a browser reload would forget the password)
$("refresh").onclick = async () => { const b = $("refresh"); b.classList.add("spin"); b.disabled = true; try { await show(tab || "Home"); } finally { b.classList.remove("spin"); b.disabled = false; } };

let showSeq = 0;
async function show(name) {
  tab = name; const mine = ++showSeq;
  for (const b of $("tabs").querySelectorAll("button[data-tab]")) b.classList.toggle("on", b.dataset.tab === name);
  $("q").hidden = name === "Home" || name === "Guide";
  $("menuName").textContent = name; $("tabs").classList.remove("open");   // phone: the menu folds away after a choice
  // Every load gets its OWN container. Before, all tabs wrote into the same box, so a slow tab that finished after you had moved on
  // added its content to the newer tab (everything showed together). Now an old tab can only write into a box nobody sees any more.
  const v = el("div"); $("view").replaceChildren(v);
  const loading = el("p", { class: "mut" }, "Loading…"); v.append(loading);
  try { await TABS[name](v); } catch (e) { if (mine === showSeq) say(e.message, "bad"); }
  loading.remove();
  if (mine === showSeq) { applyFilter(); $("stamp").textContent = "Updated " + new Date().toLocaleTimeString(); }   // keep the search text when a tab reloads after an action
  if (name !== "Home") refreshNeeds();   // keeps the red numbers in the menu fresh
}

// the red numbers in the menu: how many things wait for a person in each tab (the Home tab shows the same list)
let needs = null;
const BADGE = { Sellers: "seller_checks", Refunds: "refunds", Claims: "claims", Reports: "reports", Tickets: "tickets", Badges: "verifications", Photos: "photos", Payouts: "payouts_sellers", Suggestions: "suggestions" };
async function refreshNeeds() {
  try { needs = await call("admin", { action: "needs" }); } catch (e) { say(e.message, "bad"); return null; }
  for (const b of $("tabs").querySelectorAll("button[data-tab]")) {
    const k = BADGE[b.dataset.tab], c = k ? needs[k] || 0 : 0, p = b.querySelector(".pill");
    if (p) { p.textContent = c; p.hidden = !c; }
  }
  return needs;
}
setInterval(() => { if (secret && !document.hidden) refreshNeeds(); }, 60000);
$("q").addEventListener("input", applyFilter);

$("menuBtn").onclick = () => $("tabs").classList.toggle("open");
$("go").onclick = async () => {
  secret = $("secret").value.trim(); $("secret").value = "";
  if (!secret) return;
  let me;
  try { me = await call("admin", { action: "whoami" }); } catch (e) { secret = ""; return say(e.message, "bad"); }
  // a helper (a friend) only gets the tabs they are allowed to use; the server checks it again on every call
  isOwner = !!me.owner;
  const GROUPS = [["Money", ["Dashboard", "Money", "Refunds", "Payouts", "Referrals"]], ["Orders", ["Orders", "Claims", "Trades"]], ["Listings", ["Products", "Auctions", "Vehicles", "Properties", "Ads", "Promotions"]],
    ["People", ["Sellers", "Badges", "Banned", "Email users", "Team"]], ["Safety and support", ["Reports", "Photos", "Tickets", "Suggestions", "Words"]]];
  const placed = new Set(GROUPS.flatMap((g) => g[1]));
  const left = Object.keys(TABS).filter((n) => !placed.has(n) && n !== "Guide" && n !== "Home");
  if (left.length) GROUPS.push(["More", left]);   // a tab nobody grouped yet still shows up
  const allowed = (n) => TABS[n] && (me.owner || !["Dashboard", "Money", "Team", "Payouts", "Referrals", "Refunds", "Email users", "Ads", "Promotions", "Trades"].includes(n));
  canOpen = allowed;
  say(me.owner ? "Signed in as the owner." : `Signed in as ${me.name} (helper: everything except the money pages and team).`, "ok");
  $("shell").hidden = false;
  let before = null;   // the tab you were on, so the same button takes you back
  const gb = $("guideBtn"); gb.hidden = false;
  gb.onclick = () => { if (tab === "Guide") { show(before || "Home"); gb.textContent = "Guide"; } else { before = tab; show("Guide"); gb.textContent = "Back"; } };
  const navBtn = (n) => el("button", { "data-tab": n, onclick: () => show(n) }, n === "Home" ? "Home: needs you" : n, el("span", { class: "pill", hidden: "" }));
  const nav = $("tabs"); nav.replaceChildren(navBtn("Home"), ...GROUPS.flatMap(([g, ns]) => { const list = ns.filter(allowed); return list.length ? [el("div", { class: "grp" }, g), ...list.map(navBtn)] : []; }));
  nav.addEventListener("click", () => { gb.textContent = "Guide"; });   // a tab was chosen: the button offers the guide again
  show("Home");
};
$("secret").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
