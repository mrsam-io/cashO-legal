<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casho Admin</title>
<link rel="icon" href="https://appcasho.com/assets/icon.png"><meta name="theme-color" content="#122D24">
<style>
  @font-face { font-family:"Manrope"; src:url(https://appcasho.com/assets/fonts/Manrope-Variable.ttf) format("truetype"); font-weight:200 800; font-display:swap; }
  @font-face { font-family:"Tajawal"; src:url(https://appcasho.com/assets/fonts/Tajawal-Regular.ttf) format("truetype"); font-weight:400; font-display:swap; }
  /* Casho brand kit */
  :root { --emerald:#188B67; --deep:#126C50; --forest:#122D24; --gold:#BFA060; --bg:#F1E8D6; --fg:#122D24; --mut:#5f6f66; --line:#e3d8c0; --card:#FFFDF8; --btn:#188B67; --btnfg:#fff; --bad:#c62828; --ok:#126C50; --head:#126C50; }
  @media (prefers-color-scheme: dark) { :root { --bg:#122D24; --fg:#F5EEDD; --mut:#a9bdb3; --line:#27493c; --card:#183A2F; --btn:#188B67; --btnfg:#fff; --bad:#ef7b76; --ok:#48C5A2; --head:#FFEBC6; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.45 "Manrope","Tajawal",-apple-system,system-ui,sans-serif; max-width:1000px; margin-inline:auto; }
  header.brand { display:flex; align-items:center; gap:12px; padding:6px 0 14px; border-bottom:2px solid var(--gold); margin-bottom:12px; }
  header.brand img { height:36px; width:auto; display:block; } header.brand .logo-dark { display:none; }
  @media (prefers-color-scheme: dark) { header.brand .logo-light { display:none; } header.brand .logo-dark { display:block; } }
  header.brand span { font-weight:800; font-size:18px; color:var(--head); }
  h1 { font-size:20px; margin:0 0 12px; color:var(--head); } h2, h3 { color:var(--head); }
  nav { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  button, select, input, textarea { font:inherit; padding:8px 13px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button { cursor:pointer; font-weight:600; } button.primary { background:var(--btn); color:var(--btnfg); border-color:var(--btn); }
  button.danger { color:var(--bad); } nav button.on { background:var(--deep); color:#fff; border-color:var(--deep); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin:10px 0; box-shadow:0 4px 14px rgba(18,45,36,.07); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .mut { color:var(--mut); font-size:13px; } .bad { color:var(--bad); } .ok { color:var(--ok); }
  table { width:100%; border-collapse:collapse; font-size:14px; } td, th { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-word; } th { color:var(--head); }
  #msg { min-height:20px; margin:8px 0; }
  a { color:var(--deep); } @media (prefers-color-scheme: dark) { a { color:var(--mint,#48C5A2); } }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header class="brand"><img class="logo-light" src="https://appcasho.com/assets/logo-light.png" alt="Casho"><img class="logo-dark" src="https://appcasho.com/assets/logo-dark.png" alt="Casho"><span>Admin</span></header>
<div class="row">
  <input id="secret" type="password" placeholder="Admin secret" autocomplete="off" size="36">
  <button class="primary" id="go">Open</button>
</div>
<div id="msg" class="mut">The secret stays in this tab only. Close the tab and it is gone.</div>
<nav id="tabs" hidden></nav>
<input id="q" type="search" placeholder="Search this tab (name, username, IBAN, product, status...)" size="50" hidden>
<div class="mut" id="count"></div>
<div id="view"></div>

<script>
// Everything shown from the database is put in with textContent, never as HTML, so a hostile note or name cannot run code here.
const BASE = "https://api.appcasho.com/functions/v1/";
let secret = "", tab = "", isOwner = false;
const $ = (id) => document.getElementById(id);
const sar = (h) => (h / 100).toLocaleString("en", { minimumFractionDigits: 2 }) + " SAR";
const TEAM_URL = "https://appcasho.com/admin/";   // the link friends open (the published copy of this page)
const orderNo = (id) => "#" + String(id || "").slice(0, 8).toUpperCase();   // the same short number the buyer and the seller see on their order
const when = (t) => t ? new Date(t).toLocaleString() : "";

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) { if (k === "onclick") n.onclick = v; else if (k === "class") n.className = v; else n.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null) n.append(k);
  return n;
}
function say(text, cls = "mut") { const m = $("msg"); m.className = cls; m.textContent = text; }

async function call(fn, body) {
  const r = await fetch(BASE + fn, { method: "POST", headers: { "x-admin-secret": secret, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: "Bad reply" }));
  if (!r.ok || j.error) throw new Error(j.error || "Error " + r.status);
  return j;
}
async function act(fn, body, done) {   // run an action, show the result, reload the tab
  try { const j = await call(fn, body); say((done || "Done") + (j.emailed === true ? " · seller emailed" : j.emailed === false ? " · no email sent (seller has no email or email not set up)" : ""), "ok"); await show(tab); return j; } catch (e) { say(e.message, "bad"); }
}
async function removeProductFlow(a) {   // a = {product_id, reason, strike, report_id?}: removes a product, then handles the refunds
  try {
    const j = a.report_id
      ? await call("admin", { action: "review_report", id: a.report_id, report_action: "remove_product", reason: a.reason, strike: a.strike })
      : await call("admin", { action: "remove_product", product_id: a.product_id, reason: a.reason, strike: a.strike });
    let msg = "Product removed, seller emailed" + (j.strike ? " · strike given" : "") + (j.auction_cancelled ? " · auction cancelled" : "");
    if (j.refunds_queued) {
      if (isOwner) { try { await call("refund", { action: "run" }); msg += ` · ${j.refunds_queued} paid order(s) refunded`; } catch (e) { msg += ` · ${j.refunds_queued} refund(s) waiting: press "Process waiting refunds" in the Claims tab`; } }
      else msg += ` · ${j.refunds_queued} paid order(s) waiting for a refund: ask the owner to press "Process waiting refunds"`;
    }
    if (j.orders_in_progress) msg += ` · ${j.orders_in_progress} order(s) already shipped: handle them in Orders / Claims`;
    say(msg, "ok"); await show(tab);
  } catch (e) { say(e.message, "bad"); }
}
// CSV for Excel / Numbers / Google Sheets. The BOM makes Arabic names show correctly. A cell starting with = + - @ gets a leading ' so a hostile
// name or product title can never run as a spreadsheet formula.
function toCSV(rows) {
  const esc = (v) => { let s = String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return "﻿" + rows.map((r) => r.map(esc).join(",")).join("\r\n");
}
function download(name, rows) {
  const a = el("a", { href: URL.createObjectURL(new Blob([toCSV(rows)], { type: "text/csv;charset=utf-8" })), download: name });
  document.body.append(a); a.click(); a.remove();
}
const num = (h) => (h / 100).toFixed(2);   // halalas -> "1295.00"
const day = () => new Date().toISOString().slice(0, 10);

// the search box hides cards and table rows of the current tab that do not contain the text
function applyFilter() {
  const t = $("q").value.trim().toLowerCase();
  const items = [...$("view").querySelectorAll(".card, tr")].filter((n) => !n.querySelector("th"));
  let shown = 0;
  for (const n of items) { const hit = !t || n.textContent.toLowerCase().includes(t); n.hidden = !hit; if (hit) shown++; }
  $("count").textContent = t ? `${shown} of ${items.length} match` : "";
}

function link(url, text) { return url ? el("a", { href: url, target: "_blank", rel: "noopener" }, text) : el("span", { class: "mut" }, "no photo"); }

// ---- Dashboard > Accounting: the CSV for the accountant + costs and income typed in by hand (owner only) ----
async function accountingBlock() {
  const sar = (h) => (h / 100).toLocaleString("en", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const today = new Date(), first = new Date(today.getFullYear(), today.getMonth(), 1);
  const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const from = el("input", { type: "date", value: iso(first) }), to = el("input", { type: "date", value: iso(today) });
  const out = el("div", { class: "mut" });
  const run = async (download) => {
    try {
      const j = await call("admin", { action: "accounting_export", from: from.value, to: to.value });
      out.replaceChildren(el("div", {}, `${j.rows} lines. Revenue ${sar(j.totals.revenue)} SAR · Costs ${sar(j.totals.cost)} SAR · Profit ${sar(j.profit)} SAR · Cash in ${sar(j.totals.cash_in)} · Cash out ${sar(j.totals.cash_out)} · Owed to sellers ${sar(j.totals.liability)} (in SAR)`));
      if (download) {
        const a = el("a", { href: URL.createObjectURL(new Blob([j.csv], { type: "text/csv;charset=utf-8" })), download: `casho-accounting-${from.value}_to_${to.value}.csv` });
        document.body.append(a); a.click(); a.remove();
      }
    } catch (e) { say(String(e.message || e), "bad"); }
  };
  const range = (label, f, t) => el("button", { onclick: () => { from.value = iso(f); to.value = iso(t); } }, label);
  const y = today.getFullYear(), m = today.getMonth();
  const exportCard = el("div", { class: "card" },
    el("div", { class: "mut" }, "One CSV with every money event from every source: orders, commission, refunds, seller payouts, card fees (estimate), discounts, influencers, listing fees, promotions, gifts, car deposits, withdrawal fees, and the costs you type in below. Opens in Excel."),
    el("div", { class: "row" }, "From ", from, " To ", to),
    el("div", { class: "row" }, range("This month", first, today), range("Last month", new Date(y, m - 1, 1), new Date(y, m, 0)), range("This year", new Date(y, 0, 1), today), range("All time", new Date(2026, 0, 1), today)),
    el("div", { class: "row" }, el("button", { class: "primary", onclick: () => run(true) }, "Download CSV"), el("button", { onclick: () => run(false) }, "Show totals only")),
    out);

  // costs and other income the app cannot know
  const cats = ["Software and hosting", "Payment provider", "Apple and Google fees", "Marketing and ads", "Influencers (other)", "Legal and professional", "Salaries and contractors", "Government and licences", "Shipping and packaging", "Bank fees", "Other"];
  const f = { date: el("input", { type: "date", value: iso(today) }), kind: el("select", {}, el("option", { value: "cost" }, "Cost"), el("option", { value: "revenue" }, "Other income")),
    category: el("select", {}, ...cats.map((c) => el("option", { value: c }, c))), vendor: el("input", { placeholder: "Vendor, e.g. Supabase, AWS, Cloudflare, Resend, Anthropic" }),
    description: el("input", { placeholder: "What for, e.g. Pro plan November" }), amount: el("input", { type: "number", step: "0.01", min: "0", placeholder: "Amount in SAR" }), note: el("input", { placeholder: "Note (optional), e.g. invoice number" }) };
  const list = el("div", {});
  const load = async () => {
    const { entries } = await call("admin", { action: "entry_list" });
    list.replaceChildren(...(entries.length ? entries.map((e) => el("div", { class: "row" },
      el("span", { class: "mut" }, `${e.entry_date} · ${e.kind === "cost" ? "Cost" : "Income"} · ${e.category}${e.vendor ? " · " + e.vendor : ""}${e.description ? " · " + e.description : ""}`),
      el("b", {}, sar(e.amount_halalas) + " SAR"),
      el("button", { onclick: async () => { if (confirm("Delete this line?")) { try { await call("admin", { action: "entry_delete", id: e.id }); say("Deleted", "ok"); load(); } catch (x) { say(String(x.message || x), "bad"); } } } }, "Delete"))) : [el("p", { class: "mut" }, "Nothing typed in yet.")]));
  };
  const add = async () => {
    try {
      await call("admin", { action: "entry_add", date: f.date.value, kind: f.kind.value, category: f.category.value, vendor: f.vendor.value, description: f.description.value, amount_sar: f.amount.value, note: f.note.value });
      say("Added", "ok"); f.vendor.value = f.description.value = f.amount.value = f.note.value = ""; load();
    } catch (e) { say(String(e.message || e), "bad"); }
  };
  await load().catch((e) => list.replaceChildren(el("p", { class: "mut" }, String(e.message || e))));
  const entryCard = el("div", { class: "card" },
    el("div", { class: "mut" }, "Type in what the app cannot know: provider invoices and other costs or income. They go into the CSV. Costs from Supabase, AWS, Cloudflare, Resend, Anthropic, Apple, your domain, the lawyer, salaries ..."),
    el("div", { class: "row" }, f.date, f.kind, f.category), el("div", { class: "row" }, f.vendor, f.description), el("div", { class: "row" }, f.amount, f.note),
    el("div", { class: "row" }, el("button", { class: "primary", onclick: add }, "Add line")), list);
  return [el("h3", {}, "Accounting (for the accountant)"), exportCard, el("h3", {}, "Costs and income typed in"), entryCard];
}

const GUIDES = {"owner": {"en": "<h1>Casho admin guide</h1>\n<p class=\"mut\">For the owner and the team. Keep the admin address and password private.</p>\n\n<h2>1. Sign in and who sees what</h2>\n<ul>\n<li>Open the admin page and type your password. The <b>owner</b> sees every tab. A <b>helper</b> (a friend you added in <b>Team</b>) sees everything <b>except</b>: Dashboard, Money, Payouts, Referrals and Team, plus the on/off switches and the money decisions inside Auctions, Vehicles, Properties and Sellers. Those are marked <b>Owner</b> below. (Helpers do get Promotions, Email users and Ads.)</li>\n<li>The server checks it again on every click, so a helper cannot reach owner tabs even by trying.</li>\n<li>Everything a helper does is written to a log. The owner reads it in <b>Team, What your friends did</b>.</li>\n<li>Never share your password, and never send it in a chat. To give a friend access, use <b>Team, Add a friend</b> (it makes their own password).</li>\n</ul>\n\n<h2>2. Every day, in this order</h2>\n<ol>\n<li><b>Dashboard</b> (owner): look at <b>Needs you</b>. It lists what is waiting.</li>\n<li><b>Reports</b>: handle new reports first. Offensive or illegal content should not stay up.</li>\n<li><b>Claims</b>: buyers who say there is a problem with an order.</li>\n<li><b>Tickets</b>: answer support messages.</li>\n<li><b>Vehicles</b> and <b>Properties</b> (if switched on): approve or reject new listings.</li>\n<li><b>Sellers</b> and <b>Badges</b>: approve new seller IBANs and badge requests.</li>\n<li><b>Payouts</b> (owner): pay sellers whose orders are complete, then mark them paid.</li>\n</ol>\n\n<h2>3. What each tab does</h2>\n\n<h3>Dashboard <span class=\"mut\">(Owner)</span></h3>\n<p>The big picture: users, products, orders, revenue, Moyasar fees, referral discounts, influencer share and your <b>profit</b>. <b>Needs you</b> shows what is waiting for you. At the bottom is the <b>accountant file</b>: pick a date range and press <b>Download CSV</b> (or <b>Show totals only</b>). You can also type your own <b>costs and income</b> (for example the AWS bill) so the accountant file is complete.</p>\n\n<h3>Tickets</h3>\n<p>Messages users send from <b>Profile, Contact support</b>. Press <b>Send reply</b> to answer (the user sees it as \"Casho support\") and <b>Close ticket</b> when finished. Replying does <b>not</b> close the ticket, so you can reply many times; the history is kept. <b>Reopen</b> brings it back.</p>\n\n<h3>Claims</h3>\n<p>A buyer says there is a problem after delivery (or the parcel did not arrive). Open the claim, read the buyer's <b>photos and messages</b> and the seller's tracking photo, then:</p>\n<ul>\n<li><b>Approve (buyer returns the item)</b>: the buyer sends it back, and the money is refunded when the seller confirms it arrived.</li>\n<li><b>Reject</b>: the claim is closed and the seller is paid as normal.</li>\n<li><b>Refund now (fallback)</b> and <b>Process waiting refunds</b>: use only if a refund seems stuck.</li>\n</ul>\n<p>Use <b>Find</b> to look up an order by its number. Be fair and write short notes: money is involved.</p>\n\n<h3>Reports</h3>\n<p>Users report lives, videos, comments, messages, reviews, profiles and listings. For each report you can <b>Dismiss</b> (nothing wrong), take the content down (<b>Remove video / comment / message / listing</b>), <b>Ban account</b>, or <b>Mark handled</b>. When unsure, take the content down first and decide about the account after.</p>\n\n<h3>Banned</h3>\n<p>The list of banned accounts, with <b>Unban</b>. A banned person cannot use the app.</p>\n\n<h3>Words</h3>\n<p>The blocked-words list for chats and comments. <b>Add</b> a word and choose <b>Whole word only</b> (safer) or <b>Anywhere inside a word</b> (stronger, but may block innocent words). <b>Remove</b> deletes it.</p>\n\n<h3>Badges</h3>\n<p>Requests for the blue verified badge. Check the proof, then <b>Approve</b> or <b>Reject</b>.</p>\n\n<h3>Sellers</h3>\n<p>All sellers. Use <b>Verify IBAN</b> after checking that the IBAN is in the seller's own name (the proof photo is there). <b>Remove verification</b> undoes it. You can also <b>suspend</b> a seller (their live and sales stop) and change a seller's settings. A seller cannot be paid before the IBAN is verified.</p>\n\n<h3>Money <span class=\"mut\">(Owner)</span></h3>\n<p>Customer money held by Casho, money owed to sellers, <b>your profit</b>, and the switch for the <b>Support Casho</b> button (keep it OFF at launch).</p>\n\n<h3>Suggestions</h3>\n<p>The suggestion box from users. Mark each one <b>Read</b>, <b>Done</b> or <b>Delete</b>. Good ideas here are free product advice.</p>\n\n<h3>Products</h3>\n<p>Find any product by its number (the user sees it as <b>Product #12345678</b> and can copy it) or by name. <b>Remove product</b> takes it down (use for banned items: weapons, alcohol, medicine, fakes). <b>Restore</b> puts it back. Removing a product with a running auction cancels it and gives the seller a strike, so be sure.</p>\n\n<h3>Auctions</h3>\n<p>Running item auctions, and sellers who have <b>strikes</b>. <b>Clear strikes</b> resets a seller after you have talked to them. The owner has the on/off switch for item auctions.</p>\n\n<h3>Vehicles</h3>\n<p>New car listings wait here for <b>approval</b> (the seller already paid the listing fee). <b>Approve</b>, or <b>Reject + refund fee</b>. Also here: <b>Vehicle deals in progress</b> (deposit auctions): when a deal fails, choose who is at fault (<b>Buyer at fault</b> or <b>No fault: refund buyer</b>) and the result is applied (refund, strike, deposit owed). <b>Deposits owed to sellers</b>: pay them, then press <b>Mark paid</b>. The owner has the on/off switches. Keep vehicle auctions OFF at launch.</p>\n\n<h3>Properties</h3>\n<p>Same idea for properties: <b>Approve</b> or <b>Reject + refund fee</b> (check the photos, the licence number and the map pin), <b>Take down</b> later if needed. <b>How properties work</b> and <b>Watch the video</b> are short helpers. Casho only introduces buyer and seller; the deal happens outside the app.</p>\n\n<h3>Orders</h3>\n<p>Every order with its status. <b>Find order</b> by number, filter by status, and <b>Download CSV</b> for the accountant.</p>\n\n<h3>Payouts <span class=\"mut\">(Owner)</span></h3>\n<p>What Casho owes sellers for completed orders. Transfer the money from the bank to the seller's IBAN, then press <b>Mark paid</b>. <b>Download this list (CSV)</b> gives you the list for the bank. Only pay verified IBANs.</p>\n\n<h3>Referrals <span class=\"mut\">(Owner)</span></h3>\n<p>Referral and influencer codes: <b>Create code</b>, <b>Copy link</b>, switch a code on or off, and see how many orders used it and what you owe the influencer. Press <b>Mark paid</b> after you pay them (it then counts as a cost in the Dashboard).</p>\n\n<h3>Email users</h3>\n<p>Send an email to your users. Choose <b>Everyone / Sellers only / Buyers only</b> and the kind: <b>Marketing</b> (only people who turned on \"Send me news and offers\", with an unsubscribe link) or <b>Important</b> (everyone chosen: use only for real service notices). Always press <b>Send a test to me</b> first, read it on your phone, then <b>Send to everyone chosen</b>. It cannot be undone.</p>\n\n<h3>Ads</h3>\n<p>Short video ads shown between videos. <b>Add an ad</b> (upload an MP4, choose where the button leads: a product, a seller or a web page). Choose how often: one ad every N videos (3 to 30). Switch Ads ON or OFF here (OFF at launch).</p>\n\n<h3>Promotions</h3>\n<p>Paid promotion of a product (it shows a \"Promoted\" label and appears more). <b>Create a promotion by hand</b>, <b>Cancel</b> one, or <b>change the price</b>. Keep seller-bought promotions OFF at launch.</p>\n\n<h3>Team <span class=\"mut\">(Owner)</span></h3>\n<p><b>Add a friend</b> to make a helper account: copy the invitation and send it privately. <b>New password</b> if they lose it, <b>Remove</b> to cut access at once. <b>What your friends did</b> shows the latest 60 actions with names and times.</p>\n\n<h2>4. Money rules to remember</h2>\n<ul>\n<li>Commission is <b>15%</b> of the item. The seller also keeps the shipping fee. Shipping is a fixed fee by size: small 20, medium 30, large 50 SAR.</li>\n<li>The seller ships within <b>5 days</b>. If not, the order is cancelled and the buyer is refunded automatically.</li>\n<li>An order becomes payable about <b>14 days after shipping</b> (or when received), after the 7-day report window.</li>\n<li>Moyasar takes about 2.74% + 1 SAR per payment and per refund. That is already inside the Dashboard profit.</li>\n<li>Item auctions: the card is only <b>held</b>. The winner is charged at the end; a failed card gives the next bidders a second chance.</li>\n</ul>\n\n<h2>5. Golden rules</h2>\n<ul>\n<li>Read before you act. Refunds, bans and removals affect real people.</li>\n<li>Write what you did in the ticket or claim note, so the next person understands.</li>\n<li>Never type or paste passwords, card numbers or API keys into a chat or a ticket.</li>\n<li>If you are not sure, leave it and ask the owner. Most things can wait an hour; money mistakes cannot be undone.</li>\n<li>Be kind in replies: Arabic first, then English if the user wrote in English.</li>\n</ul>\n\n<p class=\"mut\">More: <a href=\"guide-seller.html\">Seller guide</a> · <a href=\"guide-buyer.html\">Buyer guide</a></p>", "ar": "<h1>دليل إدارة كاشو</h1>\n<p class=\"mut\">للمالك وللفريق. أبقِ رابط الإدارة وكلمة المرور سرّيين.</p>\n\n<h2>١. الدخول ومن يرى ماذا</h2>\n<ul>\n<li>افتح صفحة الإدارة واكتب كلمة المرور. <b>المالك</b> يرى كل الأقسام. أما <b>المساعد</b> (صديق أضفته من <b>Team</b>) فيرى كل شيء <b>عدا</b>: Dashboard وMoney وPayouts وReferrals وTeam، ومفاتيح التشغيل والقرارات المالية داخل Auctions وVehicles وProperties وSellers. وهذه مكتوب عليها <b>للمالك</b> أدناه. (يحصل المساعدون على Promotions وEmail users وAds.)</li>\n<li>يتحقق الخادم من الصلاحية عند كل ضغطة، فلا يستطيع المساعد الوصول لأقسام المالك.</li>\n<li>كل ما يفعله المساعد يُسجَّل، ويقرأه المالك في <b>Team ثم What your friends did</b>.</li>\n<li>لا تشارك كلمة المرور ولا ترسلها في محادثة. لإعطاء صديق صلاحية استخدم <b>Team ثم Add a friend</b> (ينشئ له كلمة مرور خاصة).</li>\n</ul>\n\n<h2>٢. كل يوم بهذا الترتيب</h2>\n<ol>\n<li><b>Dashboard</b> (للمالك): انظر <b>Needs you</b>، وهو ما ينتظرك.</li>\n<li><b>Reports</b>: عالج البلاغات الجديدة أولًا. المحتوى المسيء أو المخالف لا يبقى.</li>\n<li><b>Claims</b>: مشتري يقول إن هناك مشكلة في طلبه.</li>\n<li><b>Tickets</b>: ردّ على رسائل الدعم.</li>\n<li><b>Vehicles</b> و<b>Properties</b> (إن كانت مفعّلة): وافق أو ارفض الإعلانات الجديدة.</li>\n<li><b>Sellers</b> و<b>Badges</b>: وافق على آيبان البائعين الجدد وطلبات الشارة.</li>\n<li><b>Payouts</b> (للمالك): ادفع للبائعين الذين اكتملت طلباتهم ثم علّمها مدفوعة.</li>\n</ol>\n\n<h2>٣. ماذا يفعل كل قسم</h2>\n\n<h3>Dashboard <span class=\"mut\">(للمالك)</span></h3>\n<p>الصورة الكاملة: المستخدمون والمنتجات والطلبات والإيراد ورسوم Moyasar وخصومات الإحالة ونصيب المؤثرين و<b>ربحك</b>. يعرض <b>Needs you</b> ما ينتظرك. وفي الأسفل <b>ملف المحاسب</b>: اختر الفترة واضغط <b>Download CSV</b> (أو <b>Show totals only</b>). ويمكنك أيضًا كتابة <b>تكاليفك ودخلك</b> (مثل فاتورة AWS) ليكتمل ملف المحاسب.</p>\n\n<h3>Tickets</h3>\n<p>رسائل المستخدمين من <b>الحساب ثم تواصل مع الدعم</b>. اضغط <b>Send reply</b> للرد (يراه المستخدم باسم «Casho support») و<b>Close ticket</b> عند الانتهاء. الرد <b>لا</b> يغلق التذكرة، فيمكنك الرد أكثر من مرة ويبقى السجل. <b>Reopen</b> يعيدها.</p>\n\n<h3>Claims</h3>\n<p>مشتري يقول إن هناك مشكلة بعد التسليم (أو أن الطرد لم يصل). افتح المطالبة واقرأ <b>صور المشتري ورسائله</b> وصورة شحن البائع، ثم:</p>\n<ul>\n<li><b>Approve (buyer returns the item)</b>: يعيد المشتري المنتج، ويُسترد المبلغ عندما يؤكد البائع الوصول.</li>\n<li><b>Reject</b>: تُغلق المطالبة ويُدفع للبائع كالمعتاد.</li>\n<li><b>Refund now (fallback)</b> و<b>Process waiting refunds</b>: استخدمهما فقط إذا بدا الاسترداد عالقًا.</li>\n</ul>\n<p>استخدم <b>Find</b> للبحث برقم الطلب. كن عادلًا واكتب ملاحظات قصيرة لأن الأمر يخص المال.</p>\n\n<h3>Reports</h3>\n<p>يبلغ المستخدمون عن البثوث والفيديوهات والتعليقات والرسائل والتقييمات والحسابات والإعلانات. لكل بلاغ يمكنك <b>Dismiss</b> (لا مخالفة) أو حذف المحتوى (<b>Remove video / comment / message / listing</b>) أو <b>Ban account</b> أو <b>Mark handled</b>. إن لم تكن متأكدًا فاحذف المحتوى أولًا ثم قرر في الحساب.</p>\n\n<h3>Banned</h3>\n<p>قائمة الحسابات المحظورة مع <b>Unban</b>. المحظور لا يستطيع استخدام التطبيق.</p>\n\n<h3>Words</h3>\n<p>قائمة الكلمات الممنوعة في الدردشة والتعليقات. <b>Add</b> لإضافة كلمة مع اختيار <b>Whole word only</b> (أأمن) أو <b>Anywhere inside a word</b> (أقوى لكن قد يمنع كلمات بريئة). <b>Remove</b> للحذف.</p>\n\n<h3>Badges</h3>\n<p>طلبات الشارة الزرقاء. افحص الإثبات ثم <b>Approve</b> أو <b>Reject</b>.</p>\n\n<h3>Sellers</h3>\n<p>كل البائعين. اضغط <b>Verify IBAN</b> بعد التأكد أن الآيبان باسم البائع نفسه (صورة الإثبات موجودة). <b>Remove verification</b> للتراجع. ويمكنك أيضًا <b>إيقاف</b> البائع (يتوقف بثه ومبيعاته) وتعديل إعداداته. لا يُدفع للبائع قبل توثيق الآيبان.</p>\n\n<h3>Money <span class=\"mut\">(للمالك)</span></h3>\n<p>أموال العملاء لدى كاشو، وما يستحقه البائعون، و<b>ربحك</b>، ومفتاح زر <b>Support Casho</b> (أبقه مغلقًا عند الإطلاق).</p>\n\n<h3>Suggestions</h3>\n<p>صندوق الاقتراحات من المستخدمين. علّم كل اقتراح <b>Read</b> أو <b>Done</b> أو <b>Delete</b>. الأفكار الجيدة هنا نصيحة مجانية للمنتج.</p>\n\n<h3>Products</h3>\n<p>ابحث عن أي منتج برقمه (يراه المستخدم <b>Product #12345678</b> ويستطيع نسخه) أو باسمه. <b>Remove product</b> يحذفه (للمنتجات الممنوعة: أسلحة وكحول وأدوية ومقلّد). <b>Restore</b> يعيده. حذف منتج عليه مزاد جارٍ يلغي المزاد ويعطي البائع إنذارًا، فتأكد جيدًا.</p>\n\n<h3>Auctions</h3>\n<p>مزادات المنتجات الجارية والبائعون الذين لديهم <b>إنذارات</b>. <b>Clear strikes</b> يصفّر إنذارات البائع بعد التحدث معه. ومفتاح تشغيل مزادات المنتجات للمالك.</p>\n\n<h3>Vehicles</h3>\n<p>إعلانات السيارات الجديدة تنتظر هنا <b>الموافقة</b> (دفع البائع رسم الإعلان). <b>Approve</b> أو <b>Reject + refund fee</b>. وهنا أيضًا <b>Vehicle deals in progress</b> (مزادات العربون): عند فشل صفقة اختر المخطئ (<b>Buyer at fault</b> أو <b>No fault: refund buyer</b>) فتُطبَّق النتيجة (استرداد أو إنذار أو عربون مستحق). و<b>Deposits owed to sellers</b>: ادفعها ثم اضغط <b>Mark paid</b>. مفاتيح التشغيل للمالك. أبقِ مزادات السيارات مغلقة عند الإطلاق.</p>\n\n<h3>Properties</h3>\n<p>الفكرة نفسها للعقارات: <b>Approve</b> أو <b>Reject + refund fee</b> (افحص الصور ورقم الترخيص ودبوس الخريطة)، و<b>Take down</b> لاحقًا عند الحاجة. <b>How properties work</b> و<b>Watch the video</b> مساعدان قصيران. كاشو تعرّف المشتري بالبائع فقط، والصفقة تتم خارج التطبيق.</p>\n\n<h3>Orders</h3>\n<p>كل الطلبات مع حالتها. <b>Find order</b> برقم الطلب، وتصفية بالحالة، و<b>Download CSV</b> للمحاسب.</p>\n\n<h3>Payouts <span class=\"mut\">(للمالك)</span></h3>\n<p>ما تدين به كاشو للبائعين عن الطلبات المكتملة. حوّل المبلغ من البنك إلى آيبان البائع ثم اضغط <b>Mark paid</b>. و<b>Download this list (CSV)</b> يعطيك القائمة للبنك. ادفع فقط للآيبان الموثّق.</p>\n\n<h3>Referrals <span class=\"mut\">(للمالك)</span></h3>\n<p>رموز الإحالة والمؤثرين: <b>Create code</b> و<b>Copy link</b> وتشغيل الرمز أو إيقافه، وعدد الطلبات التي استخدمته وما تدين به للمؤثر. اضغط <b>Mark paid</b> بعد أن تدفع له (ثم يُحسب تكلفة في Dashboard).</p>\n\n<h3>Email users</h3>\n<p>أرسل بريدًا لمستخدميك. اختر <b>Everyone / Sellers only / Buyers only</b> ونوعه: <b>Marketing</b> (فقط من فعّل «أرسل لي الأخبار والعروض» وفيه رابط إلغاء الاشتراك) أو <b>Important</b> (كل من اخترت: للإشعارات الخدمية الحقيقية فقط). اضغط دائمًا <b>Send a test to me</b> أولًا واقرأه على هاتفك ثم <b>Send to everyone chosen</b>. لا يمكن التراجع.</p>\n\n<h3>Ads</h3>\n<p>إعلانات فيديو قصيرة تظهر بين الفيديوهات. <b>Add an ad</b> (ارفع MP4 واختر وجهة الزر: منتج أو بائع أو صفحة ويب). واختر تكرارها: إعلان كل N فيديو (من ٣ إلى ٣٠). شغّل الإعلانات أو أوقفها من هنا (متوقفة عند الإطلاق).</p>\n\n<h3>Promotions</h3>\n<p>ترويج مدفوع لمنتج (تظهر عليه علامة «Promoted» ويظهر أكثر). <b>Create a promotion by hand</b> أو <b>Cancel</b> أو <b>تغيير السعر</b>. أبقِ الترويج الذي يشتريه البائعون متوقفًا عند الإطلاق.</p>\n\n<h3>Team <span class=\"mut\">(للمالك)</span></h3>\n<p><b>Add a friend</b> لإنشاء حساب مساعد: انسخ الدعوة وأرسلها بشكل خاص. <b>New password</b> إن فقدها، و<b>Remove</b> لقطع الوصول فورًا. و<b>What your friends did</b> يعرض آخر ٦٠ إجراءً بالأسماء والأوقات.</p>\n\n<h2>٤. قواعد مالية تذكّرها</h2>\n<ul>\n<li>العمولة <b>١٥٪</b> من سعر المنتج. ويحتفظ البائع أيضًا برسم الشحن. والشحن رسم ثابت حسب الحجم: صغير ٢٠ ومتوسط ٣٠ وكبير ٥٠ ريالًا.</li>\n<li>يشحن البائع خلال <b>٥ أيام</b>، وإلا يُلغى الطلب ويُسترد للمشتري تلقائيًا.</li>\n<li>يصبح الطلب مستحق الدفع بعد نحو <b>١٤ يومًا من الشحن</b> (أو عند الاستلام) وبعد نافذة الإبلاغ ٧ أيام.</li>\n<li>تأخذ Moyasar نحو ٢٫٧٤٪ + ١ ريال عن كل دفعة وكل استرداد، وهذا محسوب أصلًا في ربح Dashboard.</li>\n<li>مزادات المنتجات: البطاقة <b>تُحجز</b> فقط. يُخصم من الفائز عند النهاية، وفشل البطاقة يعطي المزايدين التاليين فرصة ثانية.</li>\n</ul>\n\n<h2>٥. قواعد ذهبية</h2>\n<ul>\n<li>اقرأ قبل أن تتصرف. الاسترداد والحظر والحذف تمس أشخاصًا حقيقيين.</li>\n<li>اكتب ما فعلته في ملاحظة التذكرة أو المطالبة ليفهم الشخص التالي.</li>\n<li>لا تكتب ولا تلصق كلمات مرور أو أرقام بطاقات أو مفاتيح في محادثة أو تذكرة.</li>\n<li>إن لم تكن متأكدًا فاترك الأمر واسأل المالك. أغلب الأمور تنتظر ساعة، وأخطاء المال لا يمكن التراجع عنها.</li>\n<li>كن لطيفًا في الردود: العربية أولًا ثم الإنجليزية إذا كتب المستخدم بالإنجليزية.</li>\n</ul>"}, "helper": {"en": "<h1>Casho team guide</h1>\n<p class=\"mut\">For friends who help run Casho. Keep your admin password private.</p>\n\n<h2>1. What you can do</h2>\n<ul>\n<li>You can use almost everything: support, claims, reports, bans, words, badges, sellers, suggestions, products, auctions, vehicles, properties, orders, promotions, emails and ads.</li>\n<li>You <b>cannot</b> see the money pages: <b>Dashboard, Money, Payouts and Referrals</b>, and <b>Team</b>. They hold sensitive numbers and decisions that only the owner makes.</li>\n<li>Everything you do is saved in a log with your name and the time, for everyone's safety.</li>\n<li>Never share your password and never type it in a chat. If you lose it, ask the owner for a new one.</li>\n</ul>\n\n<h2>2. Every day, in this order</h2>\n<ol>\n<li><b>Reports</b>: handle new reports first. Offensive or illegal content should not stay up.</li>\n<li><b>Claims</b>: buyers who say there is a problem with an order.</li>\n<li><b>Tickets</b>: answer support messages.</li>\n<li><b>Vehicles</b> and <b>Properties</b>: approve or reject new listings.</li>\n<li><b>Sellers</b> and <b>Badges</b>: check new IBANs and badge requests.</li>\n<li><b>Suggestions</b>: read the new ones.</li>\n</ol>\n\n<h2>3. What each tab does</h2>\n<h3>Tickets</h3>\n<p>Messages users send from <b>Profile, Contact support</b>. Press <b>Send reply</b> to answer (the user sees it as \"Casho support\") and <b>Close ticket</b> when finished. Replying does <b>not</b> close the ticket, so you can reply many times; the history is kept. <b>Reopen</b> brings it back.</p>\n\n<h3>Claims</h3>\n<p>A buyer says there is a problem after delivery (or the parcel did not arrive). Open the claim, read the buyer's <b>photos and messages</b> and the seller's tracking photo, then:</p>\n<ul>\n<li><b>Approve (buyer returns the item)</b>: the buyer sends it back, and the money is refunded when the seller confirms it arrived.</li>\n<li><b>Reject</b>: the claim is closed and the seller is paid as normal.</li>\n<li><b>Refund now (fallback)</b> and <b>Process waiting refunds</b>: use only if a refund seems stuck.</li>\n</ul>\n<p>Use <b>Find</b> to look up an order by its number. Be fair and write short notes: money is involved.</p>\n\n<h3>Reports</h3>\n<p>Users report lives, videos, comments, messages, reviews, profiles and listings. For each report you can <b>Dismiss</b> (nothing wrong), take the content down (<b>Remove video / comment / message / listing</b>), <b>Ban account</b>, or <b>Mark handled</b>. When unsure, take the content down first and decide about the account after.</p>\n\n<h3>Banned</h3>\n<p>The list of banned accounts, with <b>Unban</b>. A banned person cannot use the app.</p>\n\n<h3>Words</h3>\n<p>The blocked-words list for chats and comments. <b>Add</b> a word and choose <b>Whole word only</b> (safer) or <b>Anywhere inside a word</b> (stronger, but may block innocent words). <b>Remove</b> deletes it.</p>\n\n<h3>Badges</h3>\n<p>Requests for the blue verified badge. Check the proof, then <b>Approve</b> or <b>Reject</b>.</p>\n\n<h3>Sellers</h3>\n<p>All sellers. Use <b>Verify IBAN</b> after checking that the IBAN is in the seller's own name (the proof photo is there). <b>Remove verification</b> undoes it. You can also <b>suspend</b> a seller (their live and sales stop). A seller cannot be paid before the IBAN is verified.</p>\n\n<h3>Suggestions</h3>\n<p>The suggestion box from users. Mark each one <b>Read</b>, <b>Done</b> or <b>Delete</b>. Good ideas here are free product advice.</p>\n\n<h3>Products</h3>\n<p>Find any product by its number (the user sees it as <b>Product #12345678</b> and can copy it) or by name. <b>Remove product</b> takes it down (use for banned items: weapons, alcohol, medicine, fakes). <b>Restore</b> puts it back. Removing a product with a running auction cancels it and gives the seller a strike, so be sure.</p>\n\n<h3>Auctions</h3>\n<p>Running item auctions, and sellers who have <b>strikes</b>. <b>Clear strikes</b> resets a seller after you have talked to them. The owner has the on/off switch for item auctions.</p>\n\n<h3>Vehicles</h3>\n<p>New car listings wait here for <b>approval</b> (the seller already paid the listing fee). <b>Approve</b>, or <b>Reject + refund fee</b>. You can also take a listing down later. Deposit deals, deposit payments and the on/off switches are handled by the owner.</p>\n\n<h3>Properties</h3>\n<p>Same idea for properties: <b>Approve</b> or <b>Reject + refund fee</b> (check the photos, the licence number and the map pin), <b>Take down</b> later if needed. <b>How properties work</b> and <b>Watch the video</b> are short helpers. Casho only introduces buyer and seller; the deal happens outside the app.</p>\n\n<h3>Orders</h3>\n<p>Every order with its status. <b>Find order</b> by number, filter by status, and <b>Download CSV</b> for the accountant.</p>\n\n<h3>Promotions</h3>\n<p>Paid promotion of a product (it shows a \"Promoted\" label and appears more). <b>Create a promotion by hand</b>, <b>Cancel</b> one, or <b>change the price</b>. Keep seller-bought promotions OFF at launch.</p>\n\n<h3>Email users</h3>\n<p>Send an email to your users. Choose <b>Everyone / Sellers only / Buyers only</b> and the kind: <b>Marketing</b> (only people who turned on \"Send me news and offers\", with an unsubscribe link) or <b>Important</b> (everyone chosen: use only for real service notices). Always press <b>Send a test to me</b> first, read it on your phone, then <b>Send to everyone chosen</b>. It cannot be undone.</p>\n\n<h3>Ads</h3>\n<p>Short video ads shown between videos. <b>Add an ad</b> (upload an MP4, choose where the button leads: a product, a seller or a web page). Choose how often: one ad every N videos (3 to 30). Switch Ads ON or OFF here (OFF at launch).</p>\n\n<h2>4. Be careful with these</h2>\n<ul>\n<li><b>Email users</b>: a mass email cannot be undone. Always send a test to yourself first, and ask the owner before you send to everyone.</li>\n<li><b>Claims, bans and removals</b> affect real people and real money. Read first, write a short note, and ask the owner when unsure.</li>\n</ul>\n\n<h2>5. Golden rules</h2>\n<ul>\n<li>Read before you act. Most things can wait an hour; mistakes with money or bans are hard to undo.</li>\n<li>Write what you did in the ticket or claim note, so the next person understands.</li>\n<li>Never type or paste passwords, card numbers or API keys into a chat or a ticket.</li>\n<li>Be kind in replies: Arabic first, then English if the user wrote in English.</li>\n</ul>", "ar": "<h1>دليل فريق كاشو</h1>\n<p class=\"mut\">للأصدقاء الذين يساعدون في إدارة كاشو. أبقِ كلمة مرورك سرّية.</p>\n\n<h2>١. ماذا تستطيع أن تفعل</h2>\n<ul>\n<li>تستطيع استخدام معظم الأقسام: الدعم والمطالبات والبلاغات والحظر والكلمات والشارات والبائعين والاقتراحات والمنتجات والمزادات والسيارات والعقارات والطلبات والترويج والبريد والإعلانات.</li>\n<li><b>لا تستطيع</b> رؤية الصفحات المالية: <b>Dashboard وMoney وPayouts وReferrals</b>، ولا <b>Team</b>. فهي تحوي أرقامًا وقرارات حساسة يتخذها المالك فقط.</li>\n<li>كل ما تفعله يُحفظ في سجل باسمك ووقته، لسلامة الجميع.</li>\n<li>لا تشارك كلمة المرور ولا تكتبها في محادثة. وإن فقدتها فاطلب من المالك كلمة جديدة.</li>\n</ul>\n\n<h2>٢. كل يوم بهذا الترتيب</h2>\n<ol>\n<li><b>Reports</b>: عالج البلاغات الجديدة أولًا. المحتوى المسيء أو المخالف لا يبقى.</li>\n<li><b>Claims</b>: مشتري يقول إن هناك مشكلة في طلبه.</li>\n<li><b>Tickets</b>: ردّ على رسائل الدعم.</li>\n<li><b>Vehicles</b> و<b>Properties</b>: وافق أو ارفض الإعلانات الجديدة.</li>\n<li><b>Sellers</b> و<b>Badges</b>: افحص الآيبان الجديد وطلبات الشارة.</li>\n<li><b>Suggestions</b>: اقرأ الجديد منها.</li>\n</ol>\n\n<h2>٣. ماذا يفعل كل قسم</h2>\n<h3>Tickets</h3>\n<p>رسائل المستخدمين من <b>الحساب ثم تواصل مع الدعم</b>. اضغط <b>Send reply</b> للرد (يراه المستخدم باسم «Casho support») و<b>Close ticket</b> عند الانتهاء. الرد <b>لا</b> يغلق التذكرة، فيمكنك الرد أكثر من مرة ويبقى السجل. <b>Reopen</b> يعيدها.</p>\n\n<h3>Claims</h3>\n<p>مشتري يقول إن هناك مشكلة بعد التسليم (أو أن الطرد لم يصل). افتح المطالبة واقرأ <b>صور المشتري ورسائله</b> وصورة شحن البائع، ثم:</p>\n<ul>\n<li><b>Approve (buyer returns the item)</b>: يعيد المشتري المنتج، ويُسترد المبلغ عندما يؤكد البائع الوصول.</li>\n<li><b>Reject</b>: تُغلق المطالبة ويُدفع للبائع كالمعتاد.</li>\n<li><b>Refund now (fallback)</b> و<b>Process waiting refunds</b>: استخدمهما فقط إذا بدا الاسترداد عالقًا.</li>\n</ul>\n<p>استخدم <b>Find</b> للبحث برقم الطلب. كن عادلًا واكتب ملاحظات قصيرة لأن الأمر يخص المال.</p>\n\n<h3>Reports</h3>\n<p>يبلغ المستخدمون عن البثوث والفيديوهات والتعليقات والرسائل والتقييمات والحسابات والإعلانات. لكل بلاغ يمكنك <b>Dismiss</b> (لا مخالفة) أو حذف المحتوى (<b>Remove video / comment / message / listing</b>) أو <b>Ban account</b> أو <b>Mark handled</b>. إن لم تكن متأكدًا فاحذف المحتوى أولًا ثم قرر في الحساب.</p>\n\n<h3>Banned</h3>\n<p>قائمة الحسابات المحظورة مع <b>Unban</b>. المحظور لا يستطيع استخدام التطبيق.</p>\n\n<h3>Words</h3>\n<p>قائمة الكلمات الممنوعة في الدردشة والتعليقات. <b>Add</b> لإضافة كلمة مع اختيار <b>Whole word only</b> (أأمن) أو <b>Anywhere inside a word</b> (أقوى لكن قد يمنع كلمات بريئة). <b>Remove</b> للحذف.</p>\n\n<h3>Badges</h3>\n<p>طلبات الشارة الزرقاء. افحص الإثبات ثم <b>Approve</b> أو <b>Reject</b>.</p>\n\n<h3>Sellers</h3>\n<p>كل البائعين. اضغط <b>Verify IBAN</b> بعد التأكد أن الآيبان باسم البائع نفسه (صورة الإثبات موجودة). <b>Remove verification</b> للتراجع. ويمكنك أيضًا <b>إيقاف</b> البائع (يتوقف بثه ومبيعاته). لا يُدفع للبائع قبل توثيق الآيبان.</p>\n\n<h3>Suggestions</h3>\n<p>صندوق الاقتراحات من المستخدمين. علّم كل اقتراح <b>Read</b> أو <b>Done</b> أو <b>Delete</b>. الأفكار الجيدة هنا نصيحة مجانية للمنتج.</p>\n\n<h3>Products</h3>\n<p>ابحث عن أي منتج برقمه (يراه المستخدم <b>Product #12345678</b> ويستطيع نسخه) أو باسمه. <b>Remove product</b> يحذفه (للمنتجات الممنوعة: أسلحة وكحول وأدوية ومقلّد). <b>Restore</b> يعيده. حذف منتج عليه مزاد جارٍ يلغي المزاد ويعطي البائع إنذارًا، فتأكد جيدًا.</p>\n\n<h3>Auctions</h3>\n<p>مزادات المنتجات الجارية والبائعون الذين لديهم <b>إنذارات</b>. <b>Clear strikes</b> يصفّر إنذارات البائع بعد التحدث معه. ومفتاح تشغيل مزادات المنتجات للمالك.</p>\n\n<h3>Vehicles</h3>\n<p>إعلانات السيارات الجديدة تنتظر هنا <b>الموافقة</b> (دفع البائع رسم الإعلان). <b>Approve</b> أو <b>Reject + refund fee</b>. ويمكنك إنزال إعلان لاحقًا. أما صفقات العربون ودفع العرابين ومفاتيح التشغيل فيتولاها المالك.</p>\n\n<h3>Properties</h3>\n<p>الفكرة نفسها للعقارات: <b>Approve</b> أو <b>Reject + refund fee</b> (افحص الصور ورقم الترخيص ودبوس الخريطة)، و<b>Take down</b> لاحقًا عند الحاجة. <b>How properties work</b> و<b>Watch the video</b> مساعدان قصيران. كاشو تعرّف المشتري بالبائع فقط، والصفقة تتم خارج التطبيق.</p>\n\n<h3>Orders</h3>\n<p>كل الطلبات مع حالتها. <b>Find order</b> برقم الطلب، وتصفية بالحالة، و<b>Download CSV</b> للمحاسب.</p>\n\n<h3>Promotions</h3>\n<p>ترويج مدفوع لمنتج (تظهر عليه علامة «Promoted» ويظهر أكثر). <b>Create a promotion by hand</b> أو <b>Cancel</b> أو <b>تغيير السعر</b>. أبقِ الترويج الذي يشتريه البائعون متوقفًا عند الإطلاق.</p>\n\n<h3>Email users</h3>\n<p>أرسل بريدًا لمستخدميك. اختر <b>Everyone / Sellers only / Buyers only</b> ونوعه: <b>Marketing</b> (فقط من فعّل «أرسل لي الأخبار والعروض» وفيه رابط إلغاء الاشتراك) أو <b>Important</b> (كل من اخترت: للإشعارات الخدمية الحقيقية فقط). اضغط دائمًا <b>Send a test to me</b> أولًا واقرأه على هاتفك ثم <b>Send to everyone chosen</b>. لا يمكن التراجع.</p>\n\n<h3>Ads</h3>\n<p>إعلانات فيديو قصيرة تظهر بين الفيديوهات. <b>Add an ad</b> (ارفع MP4 واختر وجهة الزر: منتج أو بائع أو صفحة ويب). واختر تكرارها: إعلان كل N فيديو (من ٣ إلى ٣٠). شغّل الإعلانات أو أوقفها من هنا (متوقفة عند الإطلاق).</p>\n\n<h2>٤. احذر في هذه</h2>\n<ul>\n<li><b>Email users</b>: لا يمكن التراجع عن بريد جماعي. أرسل دائمًا تجربة لنفسك أولًا، واسأل المالك قبل الإرسال للجميع.</li>\n<li><b>المطالبات والحظر والحذف</b> تمس أشخاصًا حقيقيين ومالًا حقيقيًا. اقرأ أولًا واكتب ملاحظة قصيرة واسأل المالك عند الشك.</li>\n</ul>\n\n<h2>٥. قواعد ذهبية</h2>\n<ul>\n<li>اقرأ قبل أن تتصرف. أغلب الأمور تنتظر ساعة، وأخطاء المال والحظر يصعب التراجع عنها.</li>\n<li>اكتب ما فعلته في ملاحظة التذكرة أو المطالبة ليفهم الشخص التالي.</li>\n<li>لا تكتب ولا تلصق كلمات مرور أو أرقام بطاقات أو مفاتيح في محادثة أو تذكرة.</li>\n<li>كن لطيفًا في الردود: العربية أولًا ثم الإنجليزية إذا كتب المستخدم بالإنجليزية.</li>\n</ul>"}};   // owner guide and helper guide, English and Arabic
const TABS = {
  async Guide(v) {   // what each tab does. The owner reads both guides (and gives the helper one to friends); a helper only sees the helper guide
    const box = el("div", { class: "card" });
    let who = isOwner ? "owner" : "helper", lang = "en";
    const draw = () => { box.innerHTML = GUIDES[who][lang]; box.dir = lang === "ar" ? "rtl" : "ltr"; box.lang = lang; };
    const row = el("div", { class: "row" });
    if (isOwner) row.append(el("button", { onclick: () => { who = "owner"; draw(); } }, "Owner guide"), el("button", { onclick: () => { who = "helper"; draw(); } }, "Helper guide (for your friends)"));
    row.append(el("button", { onclick: () => { lang = "en"; draw(); } }, "English"), el("button", { onclick: () => { lang = "ar"; draw(); } }, "العربية"));
    v.append(row, box); draw();
  },
  async Claims(v) {
    const find = el("input", { placeholder: "Find a claim by order number (#A1B2C3D4 or full ID)", size: "34", value: window.claimQuery || "" });
    const findBtn = el("button", { onclick: () => { window.claimQuery = find.value.trim(); show("Claims"); } }, "Find");
    find.addEventListener("keydown", (e) => { if (e.key === "Enter") findBtn.click(); });
    v.append(el("div", { class: "row" }, find, findBtn, window.claimQuery ? el("button", { onclick: () => { window.claimQuery = ""; show("Claims"); } }, "Show open claims") : null));
    const { claims } = await call("admin", { action: "claims", q: window.claimQuery || undefined });
    if (!claims.length) v.append(el("p", { class: "mut" }, window.claimQuery ? "No claim for this order number." : "No open claims."));
    for (const c of claims) {
      const o = c.orders || {};
      v.append(el("div", { class: "card" },
        el("b", {}, `Order ${orderNo(o.id)} · ${o.product_title || "?"} · ${sar(o.total_halalas || 0)}`),
        el("div", { class: "mut" }, `Full order ID: ${o.id || "?"}`),
        el("div", {}, `Reason: ${c.reason} · opened ${when(c.created_at)} · status: ${c.status}`),
        el("div", { class: "mut" }, `Buyer's note: ${c.note || "(none)"}`),
        (c.photo_urls || []).length
          ? el("div", { class: "row" }, el("span", { class: "mut" }, "Buyer's photos:"), ...c.photo_urls.map((u) => el("a", { href: u, target: "_blank", rel: "noopener" }, el("img", { src: u, style: "height:90px;margin-right:6px;border-radius:6px;border:1px solid #444" }))))
          : el("div", { class: "mut" }, c.reason === "not_delivered" ? "No photo (the parcel never arrived)." : "No photo."),
        el("div", { class: "mut" }, `Carrier: ${o.carrier || "?"} · tracking: ${o.tracking_number || "?"} · `, link(c.proof_url, "shipping proof photo")),
        (c.messages || []).length ? el("div", { class: "mut" }, el("b", {}, "Order messages:"), ...c.messages.map((m) => el("div", { dir: "auto" }, `${m.who}: ${m.body}`))) : el("div", { class: "mut" }, "No messages between buyer and seller."),
        c.status === "refunded" || c.status === "rejected"
          ? el("div", { class: "row" }, el("b", {}, c.status === "refunded" ? "Final: the buyer was refunded." : "Final: the claim was rejected (or the time to return the item ran out)."))
          : c.status === "approved"
          ? el("div", { class: "row" },

    v.append(el("div", { class: "card" }, el("b", {}, "How referral codes work"),
      el("div", {}, "1. You create a code for an influencer (for example SARA20) and send them the link. They share it with their followers."),
      el("div", {}, `2. A buyer types the code at checkout and gets ${sar(S.referral_discount_halalas || 2000)} off (items from ${sar(S.referral_min_item_halalas || 10000)}). Casho pays the discount, the seller is paid as usual. By default each person can use a code ${maxS === 0 ? "on EVERY order" : maxS === 1 ? "ONCE (any order, new or old customer)" : maxS + " times"}. A code can also have a total limit (for example 500 uses) and an end date.`),
      el("div", {}, `3. The buyer is then tied to that influencer for ${S.referral_days || 90} days. The influencer earns ${pct(S.referral_share_bps || 3000)} of Casho's commission on every COMPLETED order of that buyer in that time, whether or not the discount was used. Refunded orders earn nothing.`),
      el("div", {}, '4. When money is owed, you transfer it to the influencer yourself, then press "Mark paid" on their card.'),
      el("div", { class: "mut" }, "Default numbers are in app_settings (referral_discount_halalas, referral_share_bps, referral_days, referral_min_item_halalas, referral_max_orders). Each code can override them below.")));
    const lab = (title, help, input) => el("div", { style: "margin:6px 0" }, el("b", {}, title), el("div", { class: "mut" }, help), input);
    const code = el("input", { placeholder: "SARA20", size: 14, maxlength: 20 }), who = el("input", { placeholder: "Sara Ahmed", size: 24 });
    const disc = el("input", { placeholder: `empty = ${(S.referral_discount_halalas || 2000) / 100}`, size: 10, inputmode: "numeric" }), share = el("input", { placeholder: `empty = ${(S.referral_share_bps || 3000) / 100}`, size: 10, inputmode: "numeric" });
    const mx = el("input", { placeholder: `empty = ${maxS}`, size: 10, inputmode: "numeric" });
    const tot = el("input", { placeholder: "empty = no limit", size: 14, inputmode: "numeric" }), until = el("input", { type: "date" });
    v.append(el("div", { class: "card" }, el("b", {}, "Create a new code"),
      lab("Code", "What the buyer types: 3 to 20 letters or numbers, no spaces. Short and easy, like SARA20.", code),
      lab("Influencer name", "Only for you, to know who gets paid. The buyer never sees it.", who),
      lab("Discount for the buyer in SAR (optional)", `Leave empty for the default (${sar(S.referral_discount_halalas || 2000)}).`, disc),
      lab("Influencer share in % (optional)", `Their percentage of Casho's commission. Leave empty for the default (${pct(S.referral_share_bps || 3000)}).`, share),
      lab("Orders per buyer that get the discount (optional)", "1 = each person can use the code once (on any order, new or old customers). 0 = every order. 3 = three orders. Leave empty for the default.", mx),
      lab("Total uses allowed (optional)", "The code stops working after this many discounted orders by everyone, for example 500. Leave empty for no limit.", tot),
      lab("Valid until (optional)", "The last day the code works (Saudi time). Leave empty for no end date.", until),
      el("div", { class: "row" }, el("button", { class: "primary", onclick: () => act("admin", { action: "referral_create", code: code.value, influencer: who.value,
        discount_halalas: disc.value ? Math.round(Number(disc.value) * 100) : null, share_bps: share.value ? Math.round(Number(share.value) * 100) : null, max_orders: mx.value !== "" ? Math.round(Number(mx.value)) : null, max_uses: tot.value ? Math.round(Number(tot.value)) : null, expires_on: until.value || null }, "Code created") }, "Create code"))));
    const base = "https://appcasho.com/open.html?r=";
    for (const c of r.codes) {
      const owed = Math.max(0, Number(c.earned_halalas) - Number(c.paid_halalas));
      v.append(el("div", { class: "card" },
        el("b", {}, `${c.code} · ${c.influencer}${c.active ? "" : " (OFF)"}`),
        el("div", { class: "mut" }, `Discount ${sar(c.discount_halalas)} (${c.max_orders === 0 ? "every order" : c.max_orders === 1 ? "once per person" : c.max_orders + " orders per person"}) · used ${c.uses}${c.max_uses ? " of " + c.max_uses : ""} time(s)${c.expires_at ? " · valid until " + new Date(c.expires_at).toLocaleDateString("en-GB") + (new Date(c.expires_at) < new Date() ? " (EXPIRED)" : "") : ""} · share ${pct(c.share_bps)} · ${c.buyers} buyer(s) joined · ${c.orders} completed order(s) · Casho commission ${sar(Number(c.commission_halalas))} · discounts given ${sar(Number(c.discount_given_halalas))}`),
        el("div", {}, `Earned ${sar(Number(c.earned_halalas))} · paid ${sar(Number(c.paid_halalas))} · `, el("b", { class: owed ? "bad" : "" }, `OWED ${sar(owed)}`)),
        el("div", { class: "mut" }, `Share link: ${base}${c.code}`),
        el("div", { class: "row" },
          el("button", { onclick: () => { navigator.clipboard.writeText(base + c.code); say("Link copied", "ok"); } }, "Copy link"),
          owed ? el("button", { class: "primary", onclick: () => { const a = prompt(`How many SAR did you transfer to ${c.influencer}? (owed ${(owed / 100).toFixed(2)})`, (owed / 100).toFixed(2)); if (a && Number(a) > 0 && confirm(`Mark ${a} SAR as paid to ${c.influencer}?`)) act("admin", { action: "referral_paid", code: c.code, amount_halalas: Math.round(Number(a) * 100) }, "Marked as paid"); } }, "Mark paid") : null,
          el("button", { class: c.active ? "danger" : "primary", onclick: () => act("admin", { action: "referral_toggle", code: c.code, active: !c.active }, c.active ? "Code switched off" : "Code switched on") }, c.active ? "Switch OFF" : "Switch ON"))));
    }
  },

  async Team(v) {
    const { helpers } = await call("admin", { action: "helpers" });
    const { log } = await call("admin", { action: "team_log" });
    v.append(el("p", { class: "mut" }, "Friends who help you. A friend can handle claims, reports and orders. They cannot refund money, see bank details, or change anything else. Each friend has their own password, so you can remove one without touching the others."));
    if (window.invite) {   // shown once: the password is not stored anywhere readable
      const text = `Casho team page\nLink: ${TEAM_URL}\nYour name: ${window.invite.name}\nYour password: ${window.invite.password}\n(The password is only for you. Do not share it.)\n\nصفحة فريق كاشو\nالرابط: ${TEAM_URL}\nالاسم: ${window.invite.name}\nكلمة المرور: ${window.invite.password}\n(كلمة المرور لك وحدك. لا تشاركها.)`;
      const box = el("textarea", { readonly: "", rows: "9", style: "width:100%;font-size:14px" }); box.value = text;
      v.append(el("div", { class: "card" },
        el("b", {}, `Invitation for ${window.invite.name}: copy it now, the password is shown only once`),
        box,
        el("div", { class: "row" },
          el("button", { class: "primary", onclick: async () => { try { await navigator.clipboard.writeText(text); say("Copied. Paste it in a message to your friend.", "ok"); } catch { box.select(); say("Select the text and copy it.", "mut"); } } }, "Copy the invitation"),
          el("button", { onclick: () => { window.invite = null; show("Team"); } }, "I sent it, hide this"))));
    }
    const nameIn = el("input", { placeholder: "Friend's name, letters only (for example sara)", size: "34" });
    const addBtn = el("button", { class: "primary", onclick: async () => {
      try { const r = await call("admin", { action: "add_helper", name: nameIn.value }); window.invite = r; show("Team"); } catch (e) { say(e.message, "bad"); }
    } }, "Add a friend");
    nameIn.addEventListener("keydown", (e) => { if (e.key === "Enter") addBtn.click(); });
    v.append(el("div", { class: "row" }, nameIn, addBtn));
    if (!helpers.length) v.append(el("p", { class: "mut" }, "No friends added yet."));
    for (const h of helpers) {
      v.append(el("div", { class: "card" },
        el("b", {}, h.name), el("div", { class: "mut" }, `Added ${when(h.created_at)} · last login ${h.last_login ? when(h.last_login) : "never"}`),
        el("div", { class: "row" },
          el("button", { onclick: async () => { if (!confirm(`Make a new password for ${h.name}? The old one stops working.`)) return; try { window.invite = await call("admin", { action: "reset_helper", name: h.name }); show("Team"); } catch (e) { say(e.message, "bad"); } } }, "New password"),
          el("button", { class: "danger", onclick: () => confirm(`Remove ${h.name}? Their password stops working at once.`) && act("admin", { action: "remove_helper", name: h.name }, `${h.name} removed`) }, "Remove"))));
    }
    v.append(el("h3", {}, "What your friends did (latest 60)"));
    if (!log.length) v.append(el("p", { class: "mut" }, "Nothing yet."));
    else {
      const t = el("table", {}, el("tr", {}, ...["When", "Who", "What", "Order or item"].map((h) => el("th", {}, h))));
      for (const r of log) t.append(el("tr", {}, el("td", { class: "mut" }, when(r.at)), el("td", {}, r.who), el("td", {}, r.action), el("td", { class: "mut" }, r.target || "")));
      v.append(t);
    }
  },

  async Orders(v) {
    const sel = el("select", {}, el("option", { value: "" }, "All statuses"),
      ...["pending_payment","paid","shipped","received","completed","cancelled","expired","refund_pending","refunded","disputed"].map((s) => el("option", { value: s }, s)));
    sel.value = window.orderFilter || "";
    sel.onchange = () => { window.orderFilter = sel.value; show("Orders"); };
    const find = el("input", { placeholder: "Find by order number (#A1B2C3D4 or full ID)", size: "32", value: window.orderQuery || "" });
    const findBtn = el("button", { onclick: () => { window.orderQuery = find.value.trim(); show("Orders"); } }, "Find order");
    find.addEventListener("keydown", (e) => { if (e.key === "Enter") findBtn.click(); });
    const { orders } = await call("admin", { action: "orders", status: sel.value || undefined, q: window.orderQuery || undefined });
    const exportBtn = el("button", { class: "primary", onclick: async () => {   // accountant file: all orders, not only the ones on screen
      try {
        say("Preparing file...");
        const all = (await call("admin", { action: "orders", export: true, status: sel.value || undefined })).orders;
        const head = ["Order ID", "Created", "Paid at", "Completed at", "Status", "Product", "Buyer username", "Buyer name", "Seller username", "Seller name", "Seller IBAN", "IBAN verified",
                      "Total SAR (buyer paid)", "Item SAR", "Shipping SAR", "Commission SAR (our revenue)", "Seller amount SAR", "Moyasar payment ID", "Paid out to seller at", "Refund reason"];
        download(`cashO-orders-${day()}.csv`, [head, ...all.map((o) => [o.id, o.created_at, o.paid_at, o.completed_at, o.status, o.product_title, o.buyer_username, o.buyer_name,
          o.seller_username, o.seller_name, o.seller_iban, o.seller_iban_verified ? "yes" : "no", num(o.total_halalas), num(o.item_halalas), num(o.shipping_halalas),
          num(o.commission_halalas), num(o.seller_halalas), o.payment_id, o.paid_out_at, o.refund_reason])]);
        say(`Downloaded ${all.length} orders.`, "ok");
      } catch (e) { say(e.message, "bad"); }
    } }, "Download CSV (accountant file)");
    v.append(el("div", { class: "row" }, find, findBtn, window.orderQuery ? el("button", { onclick: () => { window.orderQuery = ""; show("Orders"); } }, "Show all") : null));
    v.append(el("div", { class: "row" }, sel, isOwner ? exportBtn : null, el("span", { class: "mut" }, `${orders.length} loaded (latest 1,000; the CSV has all)`)));
    const t = el("table", {}, el("tr", {}, ...["Order", "Product", "Status", "Buyer", "Seller", "Total", "Commission", "Note", "Created"].map((h) => el("th", {}, h))));
    for (const o of orders) t.append(el("tr", {}, el("td", { title: o.id }, orderNo(o.id), el("span", { hidden: "" }, " " + o.id)), el("td", {}, o.product_title), el("td", {}, o.status), el("td", {}, "@" + o.buyer_username), el("td", {}, `${o.seller_name} (@${o.seller_username})`),
      el("td", {}, sar(o.total_halalas)), el("td", {}, sar(o.commission_halalas)),
      el("td", { class: "mut" }, [o.refund_reason, o.paid_out_at ? "paid out" : ""].filter(Boolean).join(", ")), el("td", { class: "mut" }, when(o.created_at))));
    v.append(t);
  },

  async Payouts(v) {
    const { payouts } = await call("refund", { action: "payouts" });
    v.append(el("p", { class: "mut" }, "Owed = item price - commission + shipping fee, completed orders only, IBAN-verified sellers only. Transfer the money from your bank first, then press Mark paid."));
    if (!payouts.length) v.append(el("p", {}, "Nothing to pay out right now."));
    else v.append(el("button", { onclick: () => download(`cashO-payouts-${day()}.csv`, [["Seller name", "IBAN", "Orders", "Amount to transfer SAR", "List date"],
      ...payouts.map((p) => [p.full_name, p.iban, p.orders, num(p.owed_halalas), p.as_of])]) }, "Download this list (CSV)"));
    for (const p of payouts) {
      v.append(el("div", { class: "card" },
        el("b", {}, `${p.full_name} · ${sar(p.owed_halalas)}`), el("div", {}, `IBAN: ${p.iban}`), el("div", { class: "mut" }, `${p.orders} order(s)`),
        el("div", { class: "row" }, el("button", { class: "primary", onclick: () => confirm(`Have you transferred ${sar(p.owed_halalas)} to ${p.full_name}?`) && act("refund", { action: "paid", seller_id: p.seller_id, as_of: p.as_of }, "Marked as paid") }, "Mark paid"))));
    }
  },
};

let showSeq = 0;
async function show(name) {
  tab = name; const mine = ++showSeq;
  for (const b of $("tabs").children) b.classList.toggle("on", b.textContent === name);
  // Every load gets its OWN container. Before, all tabs wrote into the same box, so a slow tab that finished after you had moved on
  // added its content to the newer tab (everything showed together). Now an old tab can only write into a box nobody sees any more.
  const v = el("div"); $("view").replaceChildren(v);
  const loading = el("p", { class: "mut" }, "Loading…"); v.append(loading);
  try { await TABS[name](v); } catch (e) { if (mine === showSeq) say(e.message, "bad"); }
  loading.remove();
  if (mine === showSeq) applyFilter();   // keep the search text when a tab reloads after an action
}
$("q").addEventListener("input", applyFilter);

$("go").onclick = async () => {
  secret = $("secret").value.trim(); $("secret").value = "";
  if (!secret) return;
  let me;
  try { me = await call("admin", { action: "whoami" }); } catch (e) { secret = ""; return say(e.message, "bad"); }
  // a helper (a friend) only gets the tabs they are allowed to use; the server checks it again on every call
  isOwner = !!me.owner;
  const first = ["Dashboard", "Tickets", "Guide"];
  const names = [...first, ...Object.keys(TABS).filter((n) => !first.includes(n))].filter((n) => me.owner || !["Dashboard", "Money", "Team", "Payouts", "Referrals"].includes(n));
  say(me.owner ? "Signed in as the owner." : `Signed in as ${me.name} (helper: everything except the money pages and team).`, "ok");
  $("q").hidden = false;
  const nav = $("tabs"); nav.hidden = false; nav.replaceChildren(...names.map((n) => el("button", { onclick: () => show(n) }, n)));
  show(me.owner ? "Dashboard" : "Claims");
};
$("secret").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
</script>
