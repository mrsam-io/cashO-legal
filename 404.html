<body style="font-family:-apple-system,sans-serif;text-align:center;padding:60px 20px">
<p id="m">Casho · كاشو</p>
<script>
  // GitHub Pages shows this file for every unknown address. appcasho.com/@username goes to the seller page; anything else goes home.
  var m = location.pathname.match(/^\/@([A-Za-z0-9._]{3,24})\/?$/);
  location.replace(m ? "/seller.html?u=" + encodeURIComponent(m[1]) : "/");
</script>
