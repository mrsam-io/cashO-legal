<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casho · كاشو</title>
<meta name="description" content="Shop live from sellers in Saudi Arabia. Watch, bid and buy on Casho. · تسوق مباشرة من بائعين في السعودية على كاشو.">
<meta property="og:site_name" content="Casho · كاشو">
<meta property="og:title" content="Casho · كاشو">
<meta property="og:description" content="Shop live from sellers in Saudi Arabia. Watch, bid and buy on Casho.">
<meta property="og:image" content="https://appcasho.com/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#122D24">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<style>
  @font-face { font-family: "Manrope"; src: url(assets/fonts/Manrope-Variable.ttf) format("truetype"); font-weight: 200 800; font-display: swap; }
  @font-face { font-family: "Tajawal"; src: url(assets/fonts/Tajawal-Regular.ttf) format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Tajawal"; src: url(assets/fonts/Tajawal-Bold.ttf) format("truetype"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Tajawal"; src: url(assets/fonts/Tajawal-ExtraBold.ttf) format("truetype"); font-weight: 800; font-display: swap; }

  /* Casho brand kit v1: emerald, deep emerald, forest, ivory, cream, mint, gold */
  :root {
    --emerald:#188B67; --deep:#126C50; --forest:#122D24; --ivory:#F1E8D6; --cream:#FFEBC6; --mint:#48C5A2; --gold:#BFA060;
    --bg:var(--ivory); --card:#FFFDF8; --fg:#122D24; --mut:#5f6f66; --line:#e3d8c0; --price:var(--deep); --btn:var(--emerald); --btnfg:#fff;
    --font: "Manrope","Tajawal",-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:var(--forest); --card:#183A2F; --fg:#F5EEDD; --mut:#a9bdb3; --line:#27493c; --price:var(--cream); --btn:var(--emerald); }
  }
  * { box-sizing:border-box; }
  html[lang=ar] { --font: "Tajawal","Manrope",-apple-system,"Segoe UI",sans-serif; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 var(--font); min-height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; max-width:560px; width:100%; margin:0 auto; }
  header img { height:34px; width:auto; display:block; }
  .logo-dark { display:none; } @media (prefers-color-scheme: dark) { .logo-light { display:none; } .logo-dark { display:block; } }
  #lang { background:none; border:1px solid var(--line); color:var(--fg); font:600 14px var(--font); padding:6px 14px; border-radius:999px; cursor:pointer; }
  main { flex:1; width:100%; max-width:560px; margin:0 auto; padding:4px 20px 28px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:22px; overflow:hidden; box-shadow:0 10px 30px rgba(18,45,36,.12); }
  #pic { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--line); }
  .body { padding:18px 20px 20px; }
  .chip { display:inline-block; background:var(--forest); color:var(--cream); font-weight:700; font-size:12px; letter-spacing:.04em; text-transform:uppercase; padding:4px 12px; border-radius:999px; border:1px solid var(--gold); }
  h1 { font-size:26px; line-height:1.25; font-weight:800; margin:12px 0 6px; overflow-wrap:anywhere; }
  .price { font-size:24px; font-weight:800; color:var(--price); margin:0 0 6px; }
  .meta, .by { color:var(--mut); font-size:15px; margin:2px 0; }
  .desc { margin:12px 0 0; white-space:pre-line; color:var(--fg); opacity:.9; overflow-wrap:anywhere; }
  .brandcard { text-align:center; padding:34px 20px; } .brandcard img { width:96px; height:96px; border-radius:22px; }
  .brandcard h1 { margin-top:16px; }
  .actions { display:grid; gap:12px; margin-top:20px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; min-height:54px; border-radius:16px; font:800 17px var(--font); text-decoration:none; text-align:center; padding:0 18px; }
  .btn.primary { background:var(--btn); color:var(--btnfg); box-shadow:0 6px 16px rgba(24,139,103,.35); }
  .btn.second { background:transparent; color:var(--fg); border:1.5px solid var(--gold); }
  .btn.second img { width:26px; height:26px; border-radius:7px; }
  .btn[aria-disabled=true] { opacity:.75; cursor:default; }
  .hint { color:var(--mut); font-size:14px; text-align:center; margin:14px 0 0; }
  .skel { height:220px; background:linear-gradient(90deg,var(--line),transparent,var(--line)); background-size:200% 100%; animation:sh 1.4s infinite linear; }
  @keyframes sh { to { background-position:-200% 0; } }
  footer { text-align:center; color:var(--mut); font-size:13px; padding:8px 20px 28px; }
  footer a { color:var(--mut); margin:0 8px; }
  [hidden] { display:none !important; }

  .who { display:flex; gap:16px; align-items:center; padding:20px; }
  .who img { width:84px; height:84px; border-radius:50%; object-fit:cover; background:var(--line); flex:none; }
  .who h1 { margin:0; font-size:24px; } .who .meta { margin:2px 0; }
  .live { display:inline-block; background:#e5254b; color:#fff; font-weight:800; font-size:12px; padding:2px 10px; border-radius:999px; margin-inline-start:8px; vertical-align:middle; }
  .bio { padding:0 20px 20px; margin:0; white-space:pre-line; overflow-wrap:anywhere; }
  h2 { font-size:20px; font-weight:800; margin:26px 0 10px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile { display:block; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; text-decoration:none; color:var(--fg); }
  .tile img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:var(--line); }
  .tile div { padding:8px 10px 10px; } .tile b { display:block; font-size:14px; line-height:1.3; overflow-wrap:anywhere; } .tile span { color:var(--price); font-weight:800; font-size:14px; }
</style>
</head>
<body>
<header>
  <a href="./"><img class="logo-light" id="logoL" src="assets/logo-light.png" alt="Casho"><img class="logo-dark" id="logoD" src="assets/logo-dark.png" alt="Casho"></a>
  <button id="lang" type="button">العربية</button>
</header>
<main>
  <div class="card" id="card">
    <div class="skel" id="skel"></div>
    <div id="top" hidden>
      <div class="who"><img id="av" alt=""><div><h1><bdi id="nm"></bdi><span class="live" id="live" hidden>LIVE</span></h1><p class="meta"><bdi id="un"></bdi></p><p class="meta" id="fl"></p></div></div>
      <p class="bio" id="bio"></p>
    </div>
    <div class="brandcard" id="bad" hidden><img src="assets/icon.png" alt=""><h1 id="badt"></h1></div>
  </div>
  <div class="actions"><a id="open" class="btn primary" href="#"></a><a id="store" class="btn second" href="#" aria-disabled="true"><img src="assets/icon.png" alt=""><span id="storeText"></span></a></div>
  <div id="lists"></div>
  <p class="hint" id="hint"></p>
</main>
<footer><a href="terms.html" id="fTerms"></a>·<a href="privacy.html" id="fPriv"></a><div id="from"></div></footer>
<script>
  // /@username  (404.html sends it here as ?u=username). Shows the public seller page: profile + what the seller has for sale; every tile opens its own share page (open.html).
  var MEDIA = "https://d352xpzo3kf3re.cloudfront.net", API = "https://api.appcasho.com", KEY = "sb_publishable_P3xgBpTMeKfP2aN0P2psgQ_9KXIE4bl";
  var APP_STORE_URL = "";   // the App Store link when the app is live (same as in open.html)
  var T = {
    en: { other: "العربية", open: "Open in Casho", store: "Download the app", soon: "Coming soon on the App Store", hint: "If nothing happens, Casho is not installed on this phone yet.", terms: "Terms", priv: "Privacy", from: "from Mrsam",
          bad: "This seller page was not found.", items: "Items", vehicles: "Vehicles", properties: "Properties", followers: "followers", ask: "Ask the seller", live: "LIVE" },
    ar: { other: "English", open: "افتح في كاشو", store: "حمّل التطبيق", soon: "قريبًا على App Store", hint: "إذا لم يحدث شيء فلم يتم تثبيت كاشو على هذا الجوال بعد.", terms: "الشروط", priv: "الخصوصية", from: "من مرسام",
          bad: "لم يتم العثور على صفحة هذا البائع.", items: "المنتجات", vehicles: "المركبات", properties: "العقارات", followers: "متابع", ask: "اسأل البائع", live: "مباشر" }
  };
  var lang = (localStorage.getItem("casho_lang") || ((navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en"));
  var $ = function (x) { return document.getElementById(x); }, data = null;
  function sar(h) { return (h / 100).toLocaleString("en-US", { maximumFractionDigits: 2 }) + " SAR"; }
  function applyLang() {
    var t = T[lang];
    document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    $("logoL").src = lang === "ar" ? "assets/logo-ar-light.png" : "assets/logo-light.png"; $("logoD").src = lang === "ar" ? "assets/logo-ar-dark.png" : "assets/logo-dark.png";
    $("lang").textContent = t.other; $("open").textContent = t.open; $("hint").textContent = t.hint; $("storeText").textContent = APP_STORE_URL ? t.store : t.soon;
    $("fTerms").textContent = t.terms; $("fPriv").textContent = t.priv; $("from").textContent = t.from; $("live").textContent = t.live;
    if (data) draw(); else if (!$("bad").hidden) $("badt").textContent = t.bad;
  }
  $("lang").onclick = function () { lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("casho_lang", lang); } catch (e) {} applyLang(); };
  if (APP_STORE_URL) { $("store").href = APP_STORE_URL; $("store").removeAttribute("aria-disabled"); } else { $("store").onclick = function (e) { e.preventDefault(); }; }

  function tile(href, photo, title, price) {
    var a = document.createElement("a"); a.className = "tile"; a.href = href;
    var im = document.createElement("img"); im.loading = "lazy"; im.alt = ""; if (photo) im.src = MEDIA + "/product-photos/" + encodeURI(photo); a.appendChild(im);
    var d = document.createElement("div"), b = document.createElement("b"), s = document.createElement("span"); b.textContent = title; s.textContent = price || ""; d.appendChild(b); d.appendChild(s); a.appendChild(d); return a;
  }
  function section(key, rows, make) {
    if (!rows || !rows.length) return;
    var h = document.createElement("h2"); h.textContent = T[lang][key]; $("lists").appendChild(h);
    var g = document.createElement("div"); g.className = "grid"; rows.forEach(function (r) { g.appendChild(make(r)); }); $("lists").appendChild(g);
  }
  function draw() {
    var t = T[lang], d = data;
    $("skel").hidden = true; $("bad").hidden = true; $("top").hidden = false;
    $("nm").textContent = d.display_name || ""; $("un").textContent = d.username ? "@" + d.username : ""; $("live").hidden = !d.live;
    $("fl").textContent = d.followers + " " + t.followers; $("bio").textContent = d.bio || ""; $("bio").hidden = !d.bio;
    $("av").src = d.avatar_path ? MEDIA + "/avatars/" + encodeURI(d.avatar_path) : "assets/icon.png";
    document.title = (d.display_name || "Casho") + " · Casho";
    $("lists").textContent = "";
    section("items", d.items, function (x) { return tile("open.html?p=" + x.id, x.photo, x.title, sar(x.price_halalas)); });
    section("vehicles", d.vehicles, function (x) { return tile("open.html?c=" + x.id, x.photo, x.title, x.sale_type === "auction" ? "" : (x.price_halalas ? sar(x.price_halalas) : t.ask)); });
    section("properties", d.properties, function (x) { return tile("open.html?h=" + x.id, x.photo, x.title, x.price_text || x.city); });
  }
  function bad() { data = null; $("skel").hidden = true; $("top").hidden = true; $("bad").hidden = false; $("badt").textContent = T[lang].bad; $("open").href = "./"; }

  var u = (new URLSearchParams(location.search).get("u") || "").replace(/^@/, "");
  applyLang();
  if (/^[A-Za-z0-9._]{3,24}$/.test(u)) {
    fetch(API + "/rest/v1/rpc/seller_page", { method: "POST", headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_username: u }) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (!r || !r.id) return bad();
        data = r; $("open").href = "ocash://s/" + r.id; draw();
        if (/iPhone|iPad|Android/i.test(navigator.userAgent)) location.href = "ocash://s/" + r.id;   // on a phone, also try to open the app
      }).catch(bad);
  } else bad();
</script>
</body>
</html>
