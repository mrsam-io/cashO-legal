<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Unsubscribe · Casho</title>
<link rel="icon" href="assets/icon.png">
<style>
  :root { --bg:#F1E8D6; --fg:#122D24; --card:#FFFDF8; --line:#e3d8c0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#122D24; --fg:#F5EEDD; --card:#183A2F; --line:#27493c; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 -apple-system,"Segoe UI",Tahoma,sans-serif; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px; }
  main { max-width:420px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:28px 24px; text-align:center; }
  img { width:72px; height:72px; border-radius:18px; }
  h1 { font-size:22px; margin:14px 0 6px; } p { margin:8px 0; }
</style>
</head>
<body>
<main>
  <img src="assets/icon.png" alt="Casho">
  <h1 id="t">Unsubscribing…</h1>
  <p id="m"></p>
</main>
<script>
  var API = "https://kzamtrkxckztyxhcypqk.supabase.co", KEY = "sb_publishable_0AxpxZQlCOrCkTcjPVIhmg_Ed37MT0j";
  var token = new URLSearchParams(location.search).get("t") || "";
  function say(t, m) { document.getElementById("t").textContent = t; document.getElementById("m").textContent = m; }
  if (!/^[0-9a-f-]{36}$/i.test(token)) say("This link is not valid · هذا الرابط غير صالح", "");
  else fetch(API + "/rest/v1/rpc/unsubscribe_marketing", { method: "POST", headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_token: token }) })
    .then(function (r) { return r.json(); })
    .then(function (ok) { ok === true ? say("You are unsubscribed · تم إلغاء اشتراكك", "You will not get news and offers from Casho any more. Important messages about your account can still reach you. · لن تصلك أخبار وعروض كاشو بعد الآن. قد تصلك رسائل مهمة تخص حسابك.") : say("This link is not valid · هذا الرابط غير صالح", ""); })
    .catch(function () { say("Something went wrong · حدث خطأ", "Please try again later. · حاول مرة أخرى لاحقًا."); });
</script>
</body>
</html>
